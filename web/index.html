<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AI Code — Mission Control</title>
<script type="importmap">
{
  "imports": {
    "preact": "https://cdn.jsdelivr.net/npm/preact@10/dist/preact.module.js",
    "preact/hooks": "https://cdn.jsdelivr.net/npm/preact@10/hooks/dist/hooks.module.js",
    "htm": "https://cdn.jsdelivr.net/npm/htm@3/dist/htm.module.js",
    "marked": "https://cdn.jsdelivr.net/npm/marked@15.0.12/lib/marked.esm.js",
    "dompurify": "https://cdn.jsdelivr.net/npm/dompurify@3.4.15/dist/purify.es.mjs",
    "ai-code/format": "/shared/format.mjs"
  }
}
</script>
<style>
:root{
  --bg:#0a0c10;
  --panel:#11151b;
  --panel2:#171c23;
  --panel3:#1d232c;
  --line:#29313c;
  --text:#edf2f7;
  --muted:#8e9aaa;
  --accent:#9fb9ff;
  --accent-dim:#4a6fa5;
  --good:#6fe0a1;
  --warn:#ffd37a;
  --bad:#ff8585;
  --radius:10px;
  --radius-sm:6px;

  /* ---- spacing scale ----
     Every gap, pad and offset in the stylesheet is a step on this scale, which is
     what makes the rhythm read as one system rather than as a pile of nearby
     numbers. A value below 4px is chrome rather than rhythm - a keycap's inset, a
     badge's padding, a hairline offset - and stays a literal; so does anything
     above 40px, which is layout geometry (an overlay's top inset, a pane's max
     height) and not spacing at all. */
  --space-1:4px;
  --space-2:8px;
  --space-3:12px;
  --space-4:16px;
  --space-5:20px;
  --space-6:24px;
  --space-7:32px;

  /* ---- chart tokens ----
     Categorical hues in fixed slot order (never cycled, never generated), plus
     the chrome the inline SVG charts draw against. Both the eight hues and the
     chrome were validated against this theme's --panel surface: every slot sits
     inside the dark lightness band, clears the chroma floor, holds >= 3:1
     contrast on the surface, and the worst adjacent pair clears the CVD and
     normal-vision separation floors. Chart 1 is the default single-series hue. */
  --chart-surface:#11151b;
  --chart-grid:#242b35;
  --chart-axis:#39424f;
  --chart-1:#3987e5;
  --chart-2:#d95926;
  --chart-3:#199e70;
  --chart-4:#c98500;
  --chart-5:#d55181;
  --chart-6:#008300;
  --chart-7:#9085e9;
  --chart-8:#e66767;
  /* A series past the last categorical slot folds into "Other" and wears this
     neutral instead of a generated hue. It clears 3:1 on --chart-surface. */
  --chart-other:#8e9aaa;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Inter",ui-sans-serif,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0 0 var(--space-2);font-weight:650}
h1{font-size:22px}
h2{font-size:15px;color:var(--text)}
h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.muted{color:var(--muted)}
.link{color:var(--accent);text-decoration:none;font-weight:600}
.link:hover{text-decoration:underline}

/* ---- app shell ---- */
.app-shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
/* The nav stays put while the page scrolls, the same way a table header does.
   `align-self:start` is what makes sticky possible at all: a grid item stretches
   to its row by default, and a stretched item has no travel room to stick in.
   `height:100vh` bounds the pinned rail to the window and `overflow-y:auto` lets
   the nav scroll inside it when the window is shorter than the nav. */
.sidebar{border-right:1px solid var(--line);padding:var(--space-6) var(--space-4);background:#0d1014;display:flex;flex-direction:column;position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto}
.logo{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-2);padding:0 var(--space-3) var(--space-6)}
.sidebar-toggle{background:none;border:0;color:var(--muted);padding:var(--space-1) var(--space-2);border-radius:var(--radius-sm);font-size:13px;line-height:1;flex:0 0 auto}
.sidebar-toggle:hover{background:var(--panel2);color:var(--text);opacity:1}
.logo-title{font-weight:800;font-size:17px;letter-spacing:.03em}
.logo-sub{font-size:12px;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);color:var(--muted);text-decoration:none;font-weight:550;font-size:13.5px}
.nav-icon{flex:0 0 auto;display:block}
.nav-item-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item:hover{background:var(--panel2);color:var(--text)}
.nav-item.active{background:var(--panel2);color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
.nav-group{margin-top:var(--space-4)}
.nav-group:first-of-type{margin-top:0}
.nav-group-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:0 var(--space-3) var(--space-2)}
.logo-text{min-width:0}
/* Collapsed: the labels go, the icons stay. Both states render the same markup -
   the label is hidden rather than swapped out - so the rail cannot drift from
   the expanded sidebar. `title` on each link is the tooltip that names a
   destination the icon alone only suggests, and it is also the link's accessible
   name while the label is out of the tree. The group headings become hairline
   rules, since the sections they name are what the rail would otherwise lose. */
.app-shell.collapsed{grid-template-columns:64px 1fr}
.app-shell.collapsed .logo-text,.app-shell.collapsed .nav-group-label,.app-shell.collapsed .nav-item-label{display:none}
.app-shell.collapsed .logo{justify-content:center;padding:0 0 var(--space-5)}
.app-shell.collapsed .nav-item{justify-content:center;gap:0;padding:var(--space-2)}
.app-shell.collapsed .nav-group{margin-top:var(--space-3);padding-top:var(--space-3);border-top:1px solid var(--line)}
.app-shell.collapsed .nav-group:first-of-type{margin-top:0;padding-top:0;border-top:0}
.main-col{display:flex;flex-direction:column;min-width:0}
.app-header{padding:var(--space-6) var(--space-7) 0;max-width:1550px;width:100%}
.header-title{font-size:22px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Breadcrumb: the section, then the page's own subject when it has one. Muted and
   smaller, so the pair reads as depth rather than as two titles. */
.header-sep{color:var(--muted);margin:0 var(--space-2);font-weight:400}
.header-crumb{color:var(--muted);font-weight:550;font-size:17px}
.content{padding:var(--space-5) var(--space-7) var(--space-7);max-width:1550px;width:100%}

/* ---- primitives ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:var(--space-4)}
.section{margin-top:var(--space-6)}
.section.card{margin-top:var(--space-5)}
.row{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:var(--space-3)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3);margin-top:var(--space-3)}
.kv-grid{display:grid;grid-template-columns:140px 1fr;gap:var(--space-2) var(--space-3);padding-top:var(--space-2)}

button{background:var(--accent);color:#0b0d10;border:0;border-radius:var(--radius-sm);padding:var(--space-2) var(--space-4);font-weight:650;cursor:pointer;transition:opacity .15s}
button:hover{opacity:.9}
button:disabled{opacity:.5;cursor:default}
.btn.secondary{background:var(--panel3);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:#351b1b;color:#ffb5b5}

.input{width:100%;background:#0b0e12;color:var(--text);border:1px solid var(--line);padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);outline:none}
.input:focus{border-color:var(--accent-dim)}
/* One focus ring for the whole app, drawn only for keyboard navigation. Until this
   existed the only focus-visible rules in the file were on chart elements, so every
   button, tab and nav item was invisible to a keyboard user. */
button:focus-visible,.nav-item:focus-visible,.tab:focus-visible,a:focus-visible,.link-btn:focus-visible{outline:2px solid var(--accent-dim);outline-offset:2px;border-radius:var(--radius-sm)}
.tab:focus-visible{outline-offset:-2px}
.input:focus-visible{outline:2px solid var(--accent-dim);outline-offset:1px}
.field{display:grid;gap:var(--space-2)}
.field-label{font-size:12px;color:var(--muted);font-weight:600}
.inline-form{display:grid;gap:var(--space-3);margin-bottom:var(--space-4)}
textarea.input{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical}

.badge{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px var(--space-2);font-size:11.5px;font-weight:650;color:var(--muted);white-space:nowrap}
.badge-good{color:var(--good);border-color:#2c5c46}
.badge-bad{color:var(--bad);border-color:#5c2c2c}
.badge-warn{color:var(--warn);border-color:#5c4f2c}
.badge-neutral{color:var(--muted)}

.list{display:flex;flex-direction:column;gap:var(--space-2);margin-top:var(--space-3)}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:var(--space-4);background:var(--panel);border:1px solid var(--line);padding:var(--space-4);border-radius:var(--radius-sm)}
.list-row.clickable{cursor:pointer}
.list-row.clickable:hover{border-color:var(--accent-dim)}
.list-row-main{display:flex;flex-direction:column;gap:3px}
.list-row-side{display:flex;align-items:center;gap:var(--space-3)}

.empty-state{text-align:center;padding:var(--space-7) var(--space-5);color:var(--muted);display:grid;gap:var(--space-3);justify-items:center}

.spinner-wrap{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-5) var(--space-1)}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .7s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- skeletons ---- */
/* First paint, before the data arrives. Each placeholder is the shape and the
   spacing of the row it stands in for, so nothing jumps when the real rows land. */
.skeleton{display:block;border-radius:var(--radius-sm);background:linear-gradient(90deg,var(--panel2) 0%,var(--panel3) 50%,var(--panel2) 100%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
.skeleton-list{display:flex;flex-direction:column;gap:var(--space-2)}
.skeleton-row{display:flex;justify-content:space-between;align-items:center;gap:var(--space-4);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);padding:var(--space-4)}
.skeleton-lines{display:flex;flex-direction:column;gap:var(--space-2);flex:1;min-width:0}
.skeleton-line{height:12px;max-width:320px}
.skeleton-line.short{width:38%}
.skeleton-badge{height:22px;width:84px;border-radius:999px;flex:0 0 auto}
.skeleton-value{height:28px;width:56%;margin-top:var(--space-1)}
.skeleton-table{display:flex;flex-direction:column;gap:var(--space-3)}
.skeleton-trow{display:flex;gap:var(--space-5)}
.skeleton-trow .skeleton-cell:first-child{flex:2}
.skeleton-cell{height:12px;flex:1}
@media(prefers-reduced-motion:reduce){.skeleton{animation:none}}

.toast-stack{position:fixed;top:var(--space-5);right:var(--space-5);display:flex;flex-direction:column;gap:var(--space-2);z-index:1000}
.toast{background:var(--panel3);border:1px solid var(--line);border-radius:var(--radius-sm);padding:var(--space-3) var(--space-4);box-shadow:0 6px 20px rgba(0,0,0,.35);font-size:13px;min-width:220px;max-width:360px;animation:toast-in .15s ease}
.toast-success{border-color:#2c5c46;color:var(--good)}
.toast-error{border-color:#5c2c2c;color:var(--bad)}
.toast-info{color:var(--text)}
@keyframes toast-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

.code-block{white-space:pre-wrap;word-break:break-word;background:#090b0e;border:1px solid var(--line);border-radius:var(--radius);padding:var(--space-4);max-height:480px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.error-text{color:var(--bad)}

/* ---- markdown ---- */
/* Prose rendered from a plan or a review. Every rule is scoped under .md because
   the base rules for h1/h2/h3 (:67-70) are sized for chrome, not for a document:
   h3 is uppercased, letter-spaced and muted, which would render a plan's "### Step"
   as shouting grey caps. Inheritance is not enough there, so h3 is restated. */
.md{word-break:break-word;background:#090b0e;border:1px solid var(--line);border-radius:var(--radius);padding:var(--space-4);max-height:480px;overflow:auto;font-size:13.5px;line-height:1.65}
.md h1,.md h2,.md h3{margin:var(--space-5) 0 var(--space-2);font-weight:650;color:var(--text)}
.md h1{font-size:19px}
.md h2{font-size:16px}
.md h3{font-size:14px;color:var(--text);text-transform:none;letter-spacing:normal}
/* The container's own padding supplies the outer gap, so leading and trailing
   margins would double it up at the top and bottom of the block. */
.md> :first-child{margin-top:0}
.md> :last-child{margin-bottom:0}
.md p{margin:0 0 var(--space-3)}
.md ul,.md ol{margin:0 0 var(--space-3);padding-left:var(--space-5)}
.md li{margin:2px 0}
.md li>ul,.md li>ol{margin-bottom:0}
/* Inline code sits on a lighter surface than the .md background, and a fenced
   block sits on the card surface so it stays legible as a distinct block rather
   than a hole in the prose. */
.md code{background:var(--panel3);border:1px solid var(--line);border-radius:4px;padding:1px var(--space-1);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.md pre{margin:0 0 var(--space-3);padding:var(--space-3);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);overflow:auto;white-space:pre}
.md pre code{background:none;border:0;padding:0;font-size:12.5px}
.md blockquote{margin:0 0 var(--space-3);padding:0 0 0 var(--space-3);border-left:2px solid var(--accent-dim);color:var(--muted)}
.md table{width:100%;border-collapse:collapse;margin:0 0 var(--space-3)}
.md th,.md td{padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.md th{color:var(--muted);font-weight:600;font-size:12.5px}
.md hr{border:0;border-top:1px solid var(--line);margin:var(--space-4) 0}
/* Underlined at rest, unlike the app's own .link: a link inside a document is a
   link, and every one of these now opens a new tab, which a reader should see
   coming. Stated explicitly rather than left to the UA stylesheet. */
.md a{color:var(--accent);text-decoration:underline}
.md img{max-width:100%}

/* ---- metrics ---- */
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-3)}
/* min-width:0 stops the charts' measured SVG width from feeding back into the
   grid track and widening the column past the viewport. */
.metric-card{display:flex;flex-direction:column;gap:var(--space-2);min-width:0}
.metric-label{font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.metric-value{font-size:27px;font-weight:750}
.metric-note{font-size:11.5px}

/* ---- charts ---- */
.chart-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-3);margin-top:var(--space-6);align-items:start}
.chart-card{margin:0;min-width:0;overflow:visible}
.chart-head{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);margin-bottom:var(--space-1)}
.chart-head h2{margin:0}
.chart-toggle{padding:var(--space-1) var(--space-3);font-size:12px}
.chart-figure{position:relative;margin-top:var(--space-3);min-width:0}
/* Clamp the first paint (before the ResizeObserver reports) to the container,
   so a chart never pushes the page wide for a frame. */
.chart-figure svg{max-width:100%}
.chart-svg{display:block;outline:none}
.chart-svg:focus-visible{outline:2px solid var(--accent-dim);outline-offset:2px;border-radius:var(--radius-sm)}
.chart-hit{cursor:crosshair}
.chart-tick{fill:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums}
.chart-cat{fill:var(--text);font-size:12px}
.chart-value{fill:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.chart-bar{transition:filter .12s}
.chart-bar-row:hover .chart-bar{filter:brightness(1.18)}
.chart-bar-row:focus-visible{outline:2px solid var(--accent-dim);outline-offset:2px}
.chart-nodata{margin:var(--space-4) 0}
.sparkline{margin-top:2px;min-height:34px}
.sparkline svg{display:block}
.chart-tip{position:absolute;top:0;transform:translateX(-50%);background:var(--panel3);border:1px solid var(--line);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.4);white-space:nowrap;z-index:2}
.chart-tip-row{display:flex;align-items:center;gap:var(--space-2)}
.chart-tip-key{width:12px;height:2px;border-radius:1px;flex:0 0 auto}
.chart-tip-value{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.chart-tip-label{font-size:11.5px;color:var(--muted);margin-top:1px}
/* Multi-series tooltip: one row per series, each value beside the swatch that
   identifies it. Capped so the box can never widen the page - chart cards have
   no scroll container of their own. */
.chart-tip-multi{max-width:min(240px,100%);white-space:normal}
.chart-tip-head{font-size:11.5px;color:var(--muted);margin-bottom:var(--space-1)}
.chart-tip-multi .chart-tip-key{width:10px;height:10px;border-radius:2px}
.chart-tip-multi .chart-tip-value{font-size:11.5px;font-weight:600;margin-left:auto}
.chart-tip-name{flex:1 1 auto;min-width:0;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Legend: the identity channel for a multi-series chart. The swatch carries the
   hue, the text stays in an ink token, and the series total rides along so the
   chart is readable without hovering. */
.legend{list-style:none;display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-4);margin:var(--space-3) 0 0;padding:0}
.legend-item{display:flex;align-items:center;gap:var(--space-2);font-size:12px;min-width:0}
.legend-key{width:10px;height:10px;border-radius:2px;flex:0 0 auto}
.legend-label{color:var(--text)}
.legend-value{color:var(--muted);font-variant-numeric:tabular-nums}
.chart-note{margin:var(--space-3) 0 0;font-size:12px}
.run-timeline-row{outline:none}
.run-timeline-row:hover .chart-bar,.run-timeline-row:focus-visible .chart-bar{filter:brightness(1.18)}
.run-timeline-row:focus-visible{outline:2px solid var(--accent-dim);outline-offset:2px}
/* The run in flight: dimmed under a slow pulse, so the bar with no end yet is
   readable as still moving rather than as a run that finished at the axis end. */
.run-timeline-bar--live{animation:run-timeline-pulse 2s ease-in-out infinite}
.run-timeline-fallback{opacity:.7}
@keyframes run-timeline-pulse{0%,100%{opacity:.6}50%{opacity:1}}

/* Refetching keeps the previous render in place at reduced opacity rather than
   flashing a skeleton and jumping the layout. */
.is-refetching .metric-grid,.is-refetching .chart-grid,.is-refetching .section{opacity:.55;transition:opacity .15s}

.table-scroll{overflow-x:auto;overscroll-behavior-x:contain}

/* ---- segmented control (period selector) ---- */
.seg{display:inline-flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:2px}
.seg-btn{background:transparent;color:var(--muted);padding:var(--space-2) var(--space-3);border-radius:4px;font-weight:600;font-size:12.5px}
.seg-btn:hover{color:var(--text);opacity:1}
.seg-btn.active{background:var(--panel3);color:var(--text)}

/* ---- keyboard shortcuts ---- */
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 var(--space-2);background:var(--panel3);border:1px solid var(--line);border-bottom-width:2px;border-radius:var(--radius-sm);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:600;color:var(--text)}
.kbd-keys{display:inline-flex;gap:var(--space-1);flex:0 0 auto}
.kbd-hint{display:inline-flex;align-items:center;gap:var(--space-2);font-size:12px}
.kbd-overlay{position:fixed;inset:0;background:rgba(4,6,9,.62);display:flex;align-items:flex-start;justify-content:center;padding:80px var(--space-4) var(--space-6);overflow-y:auto;z-index:900}
.kbd-legend{width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.kbd-legend-head{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3)}
.kbd-list{list-style:none;margin:0;padding:0;display:grid;gap:0}
.kbd-row{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-2) var(--space-1);border-bottom:1px solid var(--line)}
.kbd-row:last-child{border-bottom:0}
.kbd-row-label{font-size:13px}

/* ---- command palette (Cmd/Ctrl+K) ---- */
/* Same overlay chrome as the shortcut legend, with the list padded out of the card
   edge so the highlighted row has somewhere to sit. */
.cmd{width:100%;max-width:560px;padding:0;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.cmd-input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:var(--space-4);font-size:15px;outline:none}
.cmd-list{list-style:none;margin:0;padding:var(--space-2);display:flex;flex-direction:column;gap:2px;max-height:min(60vh,420px);overflow-y:auto}
.cmd-group{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:var(--space-2) var(--space-3) var(--space-1)}
.cmd-item{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);cursor:pointer}
.cmd-item.active{background:var(--panel3)}
.cmd-item-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
/* The characters a fuzzy query matched. `mark`'s own yellow is not this theme. */
.cmd-hit{background:none;color:var(--accent);font-weight:700}
.cmd-item-hint{font-size:11.5px;color:var(--muted);flex:0 0 auto}
.cmd-empty{padding:var(--space-5) var(--space-3);text-align:center}
.cmd-foot{display:flex;gap:var(--space-4);border-top:1px solid var(--line);padding:var(--space-2) var(--space-4);font-size:11.5px;color:var(--muted)}

/* ---- toolbar / tabs ---- */
.view-toolbar{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);margin-bottom:var(--space-4);flex-wrap:wrap}
/* The search field the `/` shortcut has always looked for. Fixed width so the
   toolbar does not reflow as the user types. */
.search-input{width:240px;max-width:100%}
.tabs{display:flex;gap:var(--space-1);border-bottom:1px solid var(--line)}
.tab{background:transparent;color:var(--muted);border-radius:0;padding:var(--space-2) var(--space-4);font-weight:600}
.tab:hover{background:transparent;color:var(--text);opacity:1}
.tab.active{color:var(--text);border-bottom:2px solid var(--accent)}
.tab-count{color:var(--muted);font-weight:500;font-size:12px}
.tab.active .tab-count{color:var(--accent)}
/* A revision that landed while the user was on another tab. Not .tab-count, which is
   for numbers: this is a flag, and there is only ever one of it. */
.tab-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:var(--space-2);vertical-align:middle}
.tab-content{margin-top:var(--space-4)}
/* The next step in the workflow, when it lives on another tab. A pill like
   .plan-notice, but it carries the page's primary action rather than an aside, so
   the button is a real .btn: on a page whose only other affordance is a tab click,
   this is the thing to press. */
.next-step-banner{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;font-size:13px;padding:var(--space-3) var(--space-4);border:1px solid var(--accent-dim);border-radius:var(--radius-sm);background:var(--panel2);margin-bottom:var(--space-4)}
.next-step-banner .btn{padding:var(--space-2) var(--space-3);font-size:12.5px}

/* ---- task detail ---- */
/* A step above the scale's 6px rounding: the tabs sit directly under this, and at
   8px the title and the tab row read as one crowded block. */
.task-header{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-4);margin-bottom:var(--space-3)}
.task-meta{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap;font-size:12.5px;margin-top:var(--space-2)}
.task-description{margin:var(--space-3) 0 0;color:var(--muted);font-size:13.5px;line-height:1.55;max-width:700px;white-space:pre-line}
.action-bar{margin-top:var(--space-6);padding-top:var(--space-4);border-top:1px solid var(--line);display:flex;justify-content:flex-end}
.activity-box{position:relative;max-height:560px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:var(--space-4)}
.activity-notice{position:sticky;top:calc(-1 * var(--space-4));z-index:2;margin:calc(-1 * var(--space-4)) calc(-1 * var(--space-4)) var(--space-3);padding:var(--space-2) var(--space-4);background:var(--panel);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:var(--space-2)}
.link-btn{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-size:12px;font-weight:600;text-decoration:underline;cursor:pointer}
.link-btn:hover{opacity:1;text-decoration:none}
.jump-btn{position:sticky;bottom:var(--space-3);margin:var(--space-3) auto 0;display:block}
/* The revision notice, and the same shape reused for the mid-edit one. Neutral rather
   than a warning tone: a revision landing is the thing that was asked for. */
.plan-notice{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;font-size:13px;padding:var(--space-2) var(--space-3);border:1px solid var(--accent-dim);border-radius:var(--radius-sm);background:var(--panel2)}
.plan-live{margin-bottom:0}
.plan-action{margin-top:var(--space-2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- event stream ---- */
.event-stream{display:flex;flex-direction:column;gap:var(--space-2)}
.event-row{display:flex;align-items:baseline;gap:var(--space-3);border-left:2px solid var(--line);padding:var(--space-2) 0 var(--space-2) var(--space-3);font-size:13px}
/* The kind column is a fixed width so the badges stack into a scannable column
   rather than each row starting at its own offset, and the clock is pushed to the
   right edge instead of riding the end of a variable-length message. */
.event-row .badge{min-width:76px;justify-content:center}
.event-row:hover{background:rgba(255,255,255,.02)}
.event-msg{flex:1;word-break:break-word}
.event-time{font-size:11.5px;white-space:nowrap;font-variant-numeric:tabular-nums;margin-left:auto;padding-left:var(--space-3)}
/* The left rule carries the kind, so a column of rows can be scanned without reading
   every badge. Quiet kinds - a tool's output, a reasoning trace, a notice - recede
   to the muted colour; they are context for the row above them, not news. */
.event-row.kind-said{border-left-color:var(--accent-dim)}
.event-row.kind-tool{border-left-color:var(--accent)}
.event-row.kind-done{border-left-color:var(--good)}
.event-row.kind-error{border-left-color:var(--bad)}
.event-row.kind-limit{border-left-color:var(--warn)}
.event-row.kind-out .event-msg,.event-row.kind-think .event-msg,.event-row.kind-note .event-msg{color:var(--muted)}
.event-row.kind-think .event-msg{font-style:italic}

/* ---- diff viewer ---- */
/* A diff is read by scrolling down, so a line too wide for the pane wraps rather
   than scrolling the pane sideways. `pre-wrap` keeps the indentation that makes a
   diff readable; `anywhere` covers the lines that overflow at all - a minified
   bundle, a base64 blob, a long path - which `break-word` leaves overflowing. */
.diff-text{white-space:pre-wrap;overflow-wrap:anywhere;flex:1 1 auto;min-width:0}
/* Next steps in the port tab: a numbered list where each step may carry the command
   that performs it. The command is a block rather than inline, so it can be selected
   and copied whole instead of by drag. */
.steps{margin:0;padding-left:var(--space-5);display:grid;gap:var(--space-3);font-size:13px}
.steps li{padding-left:2px}
.steps .code-block{margin:var(--space-2) 0 0}
/* The port verdict. The left rule carries the state's tone the way the activity feed's
   rules carry an event's kind, so the answer is legible before the words are read. */
.port-state{background:var(--panel);border:1px solid var(--line);border-left-width:3px;border-radius:var(--radius);padding:var(--space-4)}
.port-state.good{border-left-color:var(--good)}
.port-state.warn{border-left-color:var(--warn)}
.port-state.bad{border-left-color:var(--bad)}
.port-state.neutral{border-left-color:var(--accent-dim)}
.port-head{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;margin-bottom:var(--space-2)}
.port-head h2{margin:0;font-size:15px;color:var(--text)}
.port-state p{margin:0}
.port-result{margin-top:var(--space-3);color:var(--good);font-size:13px}
/* The commits to be able to name. Referenceable rather than described: a hash is what
   you paste into git, and the subject is what makes it recognisable in a log. */
.refs{margin-top:var(--space-3);display:grid;gap:var(--space-2)}
.ref{display:flex;align-items:baseline;gap:var(--space-2);flex-wrap:wrap;font-size:12.5px}
.ref-sha{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:var(--panel3);border:1px solid var(--line);border-radius:var(--radius-sm);padding:1px var(--space-2);color:var(--accent)}
.ref-subject{color:var(--text)}
.diff-modes{display:flex;gap:var(--space-2);justify-content:flex-end;margin-bottom:var(--space-2)}
.diff-modes .btn{padding:var(--space-1) var(--space-3);font-size:11.5px;font-weight:600}
.diff-modes .btn.on{color:var(--accent);border-color:var(--accent-dim)}
.diff-viewer{background:#090b0e;border:1px solid var(--line);border-radius:var(--radius);overflow:auto;max-height:520px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.diff-line{display:flex;gap:var(--space-3);padding:1px var(--space-3)}
.diff-lineno{color:var(--muted);width:36px;text-align:right;flex:0 0 auto;user-select:none}
.diff-add{background:rgba(111,224,161,.10);color:var(--good)}
.diff-del{background:rgba(255,133,133,.10);color:var(--bad)}
.diff-hunk{color:var(--accent);background:rgba(159,185,255,.08)}
.diff-file,.diff-meta{color:var(--muted)}
/* Split view. Each row is its own two-column grid rather than one grid for the whole
   diff, so a span - a file header, a mode change, a hunk header - takes the width
   without a row being introduced to hold it. `min-width:0` on the cell and the text
   is what keeps every row's columns at exactly half: without it a long unbroken line
   widens its own column and the two halves of the diff stop lining up. */
.diff-row{display:grid;grid-template-columns:1fr 1fr}
.diff-cell{display:flex;gap:var(--space-3);padding:1px var(--space-3);min-width:0}
.diff-cell+.diff-cell{border-left:1px solid var(--line)}
.diff-span{padding:1px var(--space-3)}
.diff-blank{background:rgba(255,255,255,.02)}

/* ---- providers ---- */
.provider-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-4)}
.provider-card{display:grid;gap:var(--space-3)}
.provider-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-3)}
/* Circuit-breaker dot. The state is in the title attribute, so the card head
   stays one line and needs no extra column. */
.health{display:inline-block;flex:0 0 auto;width:8px;height:8px;border-radius:50%}
.health.good{background:var(--good)}
.health.warn{background:var(--warn)}
.health.bad{background:var(--bad)}
.model-list{display:grid;gap:var(--space-2)}
.model-row{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-3);background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:var(--space-3)}
.test-result{border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-word}
.test-result.good{background:rgba(111,224,161,.08);color:var(--good);border:1px solid #2c5c46}
.test-result.bad{background:rgba(255,133,133,.08);color:var(--bad);border:1px solid #5c2c2c}

/* ---- chat ----
   Laid out the way the chat UIs everyone already reads are: one centered column
   of prose, turns asymmetric by role - the user's own words in a bubble on the
   right, the assistant's reply as plain flowing text on the left - and a composer
   that is a single rounded shell with its send affordance inside it. */
.chat-list,.chat-conversation{display:flex;flex-direction:column;gap:var(--space-5)}
.chat-list .card{display:flex;flex-direction:column;gap:var(--space-4);max-width:600px}
/* The conversation is prose, and prose read across a 1550px dashboard is a line
   the eye cannot track back to its own start. */
.chat-conversation{max-width:720px;margin:0 auto;width:100%}
/* The card's own padding is zeroed: the header, the scrolling transcript and the
   composer each own their inset, and a padded card around a padded transcript
   was the doubled margin that read as cramped. */
.chat-card{display:flex;flex-direction:column;gap:0;padding:0;overflow:hidden;height:100%;max-height:calc(100vh - 140px)}
.chat-card .card-header{padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--line)}
/* min-height:0 is what lets the transcript shrink and scroll: without it a flex
   child refuses to go below the height of its own content. */
.chat-transcript{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:var(--space-6) var(--space-4) var(--space-4)}
/* Turns are separated by air rather than by a rule or a box that repeats. */
.chat-turn{display:flex;flex-direction:column;word-wrap:break-word}
.chat-turn+.chat-turn{margin-top:var(--space-6)}
/* A small name above the reply, the way the reference UIs do it - with no box
   around the answer, it is the only thing that says who is talking. */
.chat-role{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:var(--space-2)}
/* The user's own words: a bubble, hard right, capped at 75% so the indent reads
   as a reply rather than as a second column of text. */
.chat-turn[data-role="user"]{align-items:flex-end}
.chat-turn[data-role="user"] .chat-bubble{max-width:75%;background:var(--accent-dim);color:var(--text);border-radius:var(--radius) var(--radius) var(--space-1) var(--radius);padding:var(--space-3) var(--space-4)}
/* pre-wrap because a question written with Shift+Enter is written in lines, and
   collapsing them throws away the shape the person typed. */
.user-message{font-size:14px;line-height:1.5;white-space:pre-wrap}
/* The assistant's reply: no box at all, the markdown flowing straight down the
   column. Boxing both turns is what made the two look like the same thing - and
   the box is not the bubble's, it is `.md`'s own: that one is drawn for a plan
   in a panel, and an answer in a conversation is prose, not a panel. */
.chat-turn[data-role="assistant"] .chat-bubble{max-width:100%;padding:0}
.chat-turn[data-role="assistant"] .md{background:none;border:0;border-radius:0;padding:0;max-height:none;overflow:visible}
/* The inset is the bubble's own padding, so the markdown's outer paragraph
   margins must not add to it - they protruded past the first and last line. */
.chat-turn .md>:first-child{margin-top:0}
.chat-turn .md>:last-child{margin-bottom:0}
.chat-bubble .md pre{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:var(--space-3);overflow-x:auto;font-size:12px}
/* The composer is the shell. Its border, radius and surface are the input's
   chrome, and the textarea inside it is borderless: one shape, not a box sat
   beside a button. */
.chat-composer{display:flex;align-items:flex-end;gap:var(--space-2);margin:0 var(--space-4) var(--space-2);padding:var(--space-2) var(--space-2) var(--space-2) var(--space-4);background:var(--panel2);border:1px solid var(--line);border-radius:20px}
.chat-composer:focus-within{border-color:var(--accent-dim)}
/* TextArea renders a <label class="field"> around the textarea, so the label is
   the flex item that has to grow. The `textarea{flex:1}` that used to be here
   targeted a descendant and never fired, which is what left the field sitting at
   content width with the button stretched to full height beside it. */
.chat-composer .field{flex:1;min-width:0;gap:0}
.chat-composer textarea{flex:1;min-height:24px;max-height:200px;padding:var(--space-1) 0;border:none;background:transparent;font-family:inherit;font-size:14px;line-height:1.5;resize:none;overflow-y:auto}
/* The app-wide focus ring marks a control that is separately focusable, and this
   one is not: the shell's own border is the indicator, and it wraps the send
   button too. Without this the textarea drew a second rectangle inside the pill. */
.chat-composer .input:focus-visible{outline:none}
/* A small circle in the corner, not a rectangle stretched to the pill's height -
   the single biggest visual tell of the layouts this is modelled on. */
.chat-composer button{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;border-radius:50%;font-size:16px;line-height:1}
.chat-composer button:disabled{opacity:.4;cursor:default}
/* The keybinding hint lives under the composer rather than in the placeholder,
   which is gone the moment somebody starts typing - the one moment it matters. */
.chat-hint{margin:0 var(--space-4) var(--space-4);font-size:11.5px;color:var(--muted);text-align:center}
.sessions-list{display:grid;gap:var(--space-2)}
.session-item{padding:var(--space-3);background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius-sm);cursor:pointer;transition:all 200ms}
.session-item:hover{background:var(--panel);border-color:var(--accent-dim)}
.session-title{font-weight:600;color:var(--text)}
.session-date{font-size:12px;color:var(--muted);margin-top:var(--space-1)}
.card-header{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3)}
.card-header h1{margin:0}
.back-btn{padding:var(--space-2) var(--space-3);font-size:14px}
/* The live turn is a row: a spinner and a phrase, sat where the answer will
   land. There is no bubble to anchor to, so the two are aligned to each other.
   The spinner's own wrapper pads itself for the full-page loading blocks, which
   is the one place that padding is not wanted. */
.chat-turn.answering{flex-direction:row;align-items:center;gap:var(--space-2)}
.chat-turn.answering .spinner-wrap{padding:0}
.chat-live{color:var(--muted);font-size:12px;font-style:italic}
.chat-error{color:var(--bad);font-size:13px;padding:var(--space-2) var(--space-3);background:rgba(255,133,133,.08);border:1px solid #5c2c2c;border-radius:var(--radius-sm);margin:var(--space-2) 0}

/* ---- data table ---- */
.data-table{width:100%;border-collapse:collapse}
.data-table th,.data-table td{padding:var(--space-3);border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.data-table th{color:var(--muted);font-weight:600;font-size:12.5px;user-select:none}
.data-table th.sortable{cursor:pointer}
.data-table th.sortable:hover{color:var(--text)}
.sort-arrow{margin-left:var(--space-1);font-size:10px}
.data-table tr.clickable{cursor:pointer}
.data-table tr.clickable:hover td{background:var(--panel2)}
/* The row the arrow keys are on. Same wash as hover, so pointer and keyboard land
   on the same affordance. */
.data-table tr.focused td{background:var(--panel2);box-shadow:inset 2px 0 0 var(--accent)}
/* The header stays put while a long table scrolls under it. The background is not
   decoration: a sticky cell shows the rows behind it without one. */
.data-table thead th{position:sticky;top:0;background:var(--panel);z-index:1}
.data-table:focus-visible{outline:2px solid var(--accent-dim);outline-offset:-2px}

@media(max-width:1000px){
  .app-shell,.app-shell.collapsed{grid-template-columns:1fr}
  .sidebar{display:none}
  .metric-grid,.provider-grid,.grid3{grid-template-columns:1fr 1fr}
  .chart-grid{grid-template-columns:1fr}
  .app-header,.content{padding-left:var(--space-5);padding-right:var(--space-5)}
}
@media(max-width:650px){
  /* Metric cards stay paired - four full-width count cards is a lot of scroll
     for four short numbers. Everything else goes single column. */
  .metric-grid{grid-template-columns:1fr 1fr}
  .provider-grid,.grid3,.chart-grid{grid-template-columns:1fr}
  .list-row{flex-direction:column;align-items:flex-start}
  .kv-grid{grid-template-columns:1fr}
  .app-header,.content{padding-left:var(--space-4);padding-right:var(--space-4)}
  .app-header{padding-top:var(--space-4)}
  .content{padding-bottom:var(--space-7)}
  .card{padding:var(--space-4)}
  .header-title{font-size:19px}
  .metric-value{font-size:23px}
  /* Long titles and paths must break rather than widen the page. */
  .list-row-main{min-width:0}
  .list-row-main b,.list-row-main span{overflow-wrap:anywhere}
  .list-row-side{flex-wrap:wrap}
  .view-toolbar{gap:var(--space-2)}
  .seg-btn{padding:var(--space-2) var(--space-3)}
  .kbd-overlay{padding:var(--space-6) var(--space-3)}
  /* Toasts are fixed, so an oversized one is clipped rather than scrolled -
     pin them to the viewport edges instead. */
  .toast-stack{left:var(--space-4);right:var(--space-4)}
  .toast{min-width:0;max-width:none}
  .data-table th,.data-table td{padding:var(--space-2)}
  .md th,.md td{padding:var(--space-2)}
  /* A wide table gets its own horizontal scroll instead of pushing the whole
     page sideways. Chart cards are excluded on purpose: a scroll container on
     one axis forces the other to auto, which would clip the chart tooltip. */
  .card:not(:has(.chart-figure)){overflow-x:auto;overscroll-behavior-x:contain}
  /* The chat card is a fixed shell whose transcript is already the scroll
     container, so neither the narrow-screen card padding nor the wide-content
     scroll rule above applies to it. Written after that rule and at its
     specificity, because both would otherwise win on source order. */
  .card.chat-card{padding:0;overflow:hidden}
}
/* Narrow phones: a two-up metric row leaves too little room for the value. */
@media(max-width:400px){
  .metric-grid{grid-template-columns:1fr}
  .metric-value{font-size:21px}
}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/app.mjs"></script>
</body>
</html>
