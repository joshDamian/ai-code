.btn.danger-outline:hover:not(:disabled){background:var(--bad-bg);border-color:var(--bad)}
.steps-list{margin:0;padding-left:1.3em;display:grid;gap:var(--space-2);line-height:1.6}
@media(max-width:900px){.settings-section{grid-template-columns:minmax(0,1fr);gap:var(--space-3)}}
@media(max-width:650px){
  .provider-card-head{flex-wrap:wrap}
  .provider-card-title{flex-basis:100%}
  /* A table on a phone scrolls sideways rather than wrapping its first column one
     word to a line - a title stacked five lines deep is a row nobody can read. */
  .data-table td:first-child,.data-table th:first-child{min-width:200px}
}
/* ---- routing ---- */
.role-card{display:grid;gap:var(--space-4)}
.role-picks{margin:0;font-size:var(--text-sm)}
.role-picks b{color:var(--text);font-weight:600}
.role-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap}
.role-card-title{display:grid;gap:4px;min-width:0;flex:1 1 280px}
.role-card-title h2{margin:0;font-size:var(--text-lg)}
.role-card-title p{margin:0;font-size:var(--text-sm)}
.role-chain{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);align-items:end;gap:var(--space-2)}
.role-chain-arrow{color:var(--muted);padding-bottom:9px}
.role-knobs{display:flex;align-items:flex-end;gap:var(--space-5);flex-wrap:wrap;padding-top:var(--space-4);border-top:1px solid var(--line)}
.role-knobs .seg{align-self:start}
.role-timeout{width:200px}
.input-suffix{display:flex;align-items:center;background:var(--surface-0);border:1px solid var(--line);border-radius:var(--radius-sm)}
.input-suffix:focus-within{border-color:var(--accent-dim)}
.input-suffix .input{border:0;background:none;min-width:0}
.input-suffix .input:focus-visible{outline:none}
.input-suffix>span{padding:0 var(--space-3);color:var(--muted);font-size:var(--text-sm)}
/* A save bar that exists only while there is something to save: a Save button that
   is always on screen cannot say whether pressing it would change anything. */
.save-bar{position:sticky;bottom:var(--space-4);z-index:30;display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-3) var(--space-3) var(--space-4);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--radius);box-shadow:var(--shadow-3);animation:ss-rise .18s var(--ease)}
.save-bar>span{flex:1;min-width:0;font-weight:600}
@media(max-width:900px){.role-chain{grid-template-columns:minmax(0,1fr)}.role-chain-arrow{display:none}}
.welcome{display:grid;gap:var(--space-5);max-width:820px;padding:var(--space-6)}
.welcome-head h2{margin:0 0 var(--space-2);font-size:var(--text-2xl);letter-spacing:-.02em}
.welcome-head p{margin:0;line-height:1.55}
.welcome-steps{list-style:none;margin:0;padding:0;display:grid;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.welcome-step{display:grid;grid-template-columns:32px minmax(0,1fr) auto;align-items:center;gap:var(--space-4);padding:var(--space-4);border-bottom:1px solid var(--line)}
.welcome-step:last-child{border-bottom:0}
.welcome-step>div{display:grid;gap:3px;min-width:0}
.welcome-step .muted{font-size:var(--text-sm)}
.welcome-num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:650;font-size:var(--text-sm);background:var(--surface-3);border:1px solid var(--line-strong)}
.welcome-step.done .welcome-num{background:var(--good-bg);border-color:var(--good-line);color:var(--good)}
.welcome-step.pending{opacity:.7}
@media(max-width:650px){.welcome{padding:var(--space-4)}.welcome-step{grid-template-columns:28px minmax(0,1fr)}.welcome-step>.btn{grid-column:2;justify-self:start}}
.no-project{display:grid;gap:var(--space-3);justify-items:start;max-width:440px}
.no-project h2{margin:0;font-size:var(--text-xl)}
.no-project p{margin:0;line-height:1.55}
/* ---- review tab ---- */
.review-card{padding:0;display:grid;overflow:hidden}
.review-head{padding:var(--space-5) var(--space-5) var(--space-4);display:grid;gap:6px}
.review-head-icon{grid-template-columns:auto minmax(0,1fr);align-items:start;gap:var(--space-4)}
.review-head h2{margin:0;font-size:var(--text-lg)}
.review-head p{margin:0;line-height:1.55;font-size:var(--text-md)}
.review-icon{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--info-bg);border:1px solid var(--info-line);color:var(--info)}
.review-icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.review-alert{margin:0 var(--space-5) var(--space-4);padding:var(--space-3) var(--space-4);border:1px solid var(--bad-line);background:var(--bad-bg);border-radius:var(--radius-sm);display:flex;gap:var(--space-3);align-items:flex-start}
.review-alert>div{flex:1;min-width:0;display:grid;gap:4px}
.review-alert span{font-size:var(--text-sm);color:var(--text);opacity:.85;overflow-wrap:anywhere}
.review-alert .link{white-space:nowrap;font-size:var(--text-sm)}
.review-body{display:grid;grid-template-columns:minmax(0,1fr) 320px;border-top:1px solid var(--line)}
.review-change{padding:var(--space-4) var(--space-5) var(--space-5);display:grid;gap:var(--space-3);align-content:start;border-right:1px solid var(--line);min-width:0}
.review-label{display:flex;align-items:baseline;gap:var(--space-3)}
.review-label h3,.review-facts dt{margin:0;font-size:var(--text-xs);font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.review-label .muted{font-size:var(--text-sm)}
.review-card .good{color:var(--good)}.review-card .bad{color:var(--bad)}
.review-files{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-0)}
.review-files li{display:flex;align-items:center;gap:var(--space-3);padding:9px var(--space-3);border-bottom:1px solid var(--line);font-family:var(--font-mono);font-size:var(--text-sm);min-width:0}
.review-files li:last-child{border-bottom:0}
.review-file-mark{width:6px;height:6px;border-radius:1px;background:var(--warn);flex:none}
.review-file-path{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.review-toggle{justify-self:start;text-decoration:none}
.review-file-mark.fresh{background:var(--good)}
.review-new{font-family:var(--font-ui);font-size:var(--text-xs);font-weight:600}
.review-facts{margin:0;padding:var(--space-4) var(--space-5) var(--space-5);display:grid;gap:var(--space-4);align-content:start}
.review-facts>div{display:grid;gap:4px}
.review-facts dd{margin:0;font-size:var(--text-md);min-width:0;overflow-wrap:anywhere}
.review-facts .link-btn,.review-facts .link{text-decoration:none;font-size:var(--text-sm)}
.review-tests{display:flex;align-items:center;gap:var(--space-2)}
.review-foot{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;padding:var(--space-3) var(--space-5);border-top:1px solid var(--line);background:var(--surface-rail)}
.review-foot>.muted{flex:1 1 240px;font-size:var(--text-sm)}
.review-steps{list-style:none;margin:0;padding:var(--space-2) var(--space-5) var(--space-5);display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.review-step{display:grid;gap:4px;padding-right:var(--space-4);align-content:start}
.review-step-mark{display:flex;align-items:center;gap:var(--space-2);margin-bottom:6px}
.review-step-mark span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:var(--text-sm);font-weight:700;background:var(--surface-3);border:1px solid var(--line-strong);color:var(--muted)}
.review-step-mark i{flex:1;height:2px;background:var(--line)}
.review-step b{font-size:var(--text-md);color:var(--muted)}
.review-step b small{font-weight:500;font-size:var(--text-xs)}
.review-step>span{font-size:var(--text-sm);color:var(--muted);line-height:1.45}
.review-step.current .review-step-mark span{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.review-step.current b{color:var(--text)}
.review-step.current>span{color:var(--accent)}
.review-step.done .review-step-mark span{background:var(--good-bg);border-color:var(--good-line);color:var(--good)}
.review-step.done .review-step-mark i{background:var(--good-line)}
.review-step.here:not(.current) .review-step-mark span{border-style:dashed;border-color:var(--accent-dim);color:var(--accent)}
@media(max-width:900px){
  .review-body{grid-template-columns:minmax(0,1fr)}
  .review-change{border-right:0;border-bottom:1px solid var(--line)}
  .review-steps{grid-template-columns:minmax(0,1fr);gap:var(--space-3)}
  .review-step-mark i{display:none}
}
@media(max-width:650px){
  .review-head,.review-change,.review-facts,.review-foot{padding-left:var(--space-4);padding-right:var(--space-4)}
  .review-foot{display:grid;grid-template-columns:1fr 1fr}
  .review-foot>.muted{grid-column:1/-1}
  .review-foot .btn{min-height:48px}
  .review-alert{margin-left:var(--space-4);margin-right:var(--space-4);flex-direction:column}
}
/* ---- toggle ---- */
.toggle{display:inline-flex;align-items:center;gap:var(--space-2);cursor:pointer;font-size:var(--text-sm);color:var(--muted);white-space:nowrap}
.toggle.disabled{cursor:default;opacity:.55}
.toggle-track{position:relative;width:34px;height:20px;flex:none;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface-3);padding:0;cursor:inherit;transition:background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease)}
.toggle-track.on{background:var(--accent);border-color:var(--accent)}
.toggle-thumb{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--text);transition:transform var(--dur-fast) var(--ease)}
.toggle-track.on .toggle-thumb{transform:translateX(14px);background:var(--on-accent)}
.toggle-track:disabled{cursor:default}
@media(pointer:coarse){.toggle-track{min-height:0}.toggle{min-height:44px}}
@media(prefers-reduced-motion:reduce){.toggle-thumb,.toggle-track{transition:none}}
.test-result{border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);font-size:var(--text-sm);font-family:var(--font-mono);word-break:break-word}
.test-result.good{background:var(--good-bg);color:var(--good);border:1px solid var(--good-line)}
.test-result.bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-line)}

/* ---- chat ---- */
.chat-error{color:var(--bad);font-size:var(--text-md);padding:var(--space-2) var(--space-3);background:var(--bad-bg);border:1px solid var(--bad-line);border-radius:var(--radius-sm);margin:var(--space-2) 0}

/* ---- supervised sessions ---- */
/* A workspace, not a page: the list, the open session and its details side by side,
   filling the height under the header so the transcript scrolls and the composer
   stays put. `:has` sizes the shell's ancestors only while the view is mounted. */
.main-col:has(.ss-shell){height:100vh;height:100dvh}
.content:has(>.ss-shell){flex:1;min-height:0;display:flex;padding-bottom:var(--space-5)}
.ss-shell{flex:1;min-height:0;display:grid;grid-template-columns:280px minmax(0,1fr) 300px;background:var(--surface-0);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;position:relative}
.ss-shell-index,.ss-shell-new{grid-template-columns:280px minmax(0,1fr)}
.ss-ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;transition:transform var(--dur-fast) var(--ease)}
.ss-ic.open{transform:rotate(90deg)}
.ss-ic.good,.ss-shell .good{color:var(--good)}
.ss-ic.bad,.ss-shell .bad{color:var(--bad)}
.ss-ic.warn{color:var(--warn)}
.ss-ic.accent{color:var(--accent)}
.ss-mono{font-family:var(--font-mono);font-size:.93em}
.ss-path-dir{color:var(--muted)}
.ss-icon-btn{width:34px;height:34px;padding:0;flex:none}

/* The list. Grouped by what each session needs from you, in the order you deal
   with them; a row says what it is asking for or doing without being opened. */
.ss-list{display:flex;flex-direction:column;min-height:0;background:var(--surface-rail);border-right:1px solid var(--line)}
.ss-list-head{padding:var(--space-4) var(--space-3) var(--space-2);display:grid;gap:var(--space-3)}
.ss-list-title{display:flex;align-items:center;gap:var(--space-2);min-width:0}
.ss-project{flex:1;min-width:0}
.ss-project .select-trigger{height:32px;padding-top:0;padding-bottom:0;font-weight:600}
.ss-project-name{flex:1;min-width:0;font-weight:650;font-size:var(--text-md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss-new{height:32px}
.ss-new .ss-ic{width:14px;height:14px}
.ss-list-tools{display:flex;gap:var(--space-2)}
.ss-filter{flex:1;min-width:0;display:flex;align-items:center;gap:var(--space-2);height:34px;padding:0 var(--space-3);background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius-sm);color:var(--muted)}
.ss-filter:focus-within{border-color:var(--accent-dim)}
.ss-filter .ss-ic{width:14px;height:14px}
.ss-filter input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:var(--text-sm)}
.ss-list-body{flex:1;min-height:0;overflow-y:auto;padding:0 var(--space-2) var(--space-3)}
.ss-list-empty{padding:var(--space-6) var(--space-3);text-align:center;margin:0;font-size:var(--text-sm)}
.ss-group{display:grid;gap:2px;margin-bottom:var(--space-1)}
.ss-group-label{padding:var(--space-3) var(--space-2) var(--space-1);font-size:var(--text-xs);font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ss-group-needs{color:var(--warn)}
.ss-row-wrap{position:relative}
.ss-row-wrap .ss-row{padding-right:40px}
.ss-row-menu{position:absolute;top:6px;right:4px;opacity:0;transition:opacity var(--dur-fast) var(--ease)}
.ss-row-wrap:hover .ss-row-menu,.ss-row-menu:focus-within{opacity:1}
.ss-row-menu .ss-icon-btn{width:28px;height:28px;background:var(--surface-2)}
@media(pointer:coarse){.ss-row-menu{opacity:1}}
.ss-row{display:flex;gap:10px;padding:10px 10px 10px 8px;border-radius:var(--radius-sm);border:1px solid transparent;color:var(--text);text-decoration:none;min-width:0}
.ss-row:hover{background:var(--surface-1);color:var(--text)}
.ss-row.active{background:var(--surface-2);border-color:var(--line-strong)}
.ss-row-needs:not(.active){background:var(--warn-bg)}
.ss-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;box-sizing:border-box}
.ss-dot-needs{background:var(--warn);box-shadow:0 0 0 3px var(--warn-bg)}
.ss-dot-working{background:var(--accent);box-shadow:0 0 0 3px var(--info-bg);animation:ss-pulse 1.6s ease-in-out infinite}
.ss-dot-idle{border:1.5px solid var(--line-strong)}
.ss-dot-closed{background:var(--line)}
@keyframes ss-pulse{50%{opacity:.4}}
.ss-row-main{display:grid;gap:3px;min-width:0;flex:1}
.ss-row-top{display:flex;align-items:baseline;gap:var(--space-2);min-width:0}
.ss-row-name{flex:1;min-width:0;font-size:var(--text-md);font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss-row-when{font-size:var(--text-xs);color:var(--muted);flex:none}
.ss-row-clock{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--warn);flex:none;font-variant-numeric:tabular-nums}
.ss-row-line{font-size:var(--text-sm);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss-row-needs .ss-row-line{color:var(--text);opacity:.8}
.ss-closed-toggle{display:flex;align-items:center;gap:var(--space-2);width:100%;padding:var(--space-3) var(--space-2);background:none;border:0;border-top:1px solid var(--line);color:var(--muted);font:inherit;font-size:var(--text-sm);cursor:pointer;text-align:left}
.ss-closed-toggle:hover{color:var(--text)}
.ss-closed-toggle .ss-ic{width:14px;height:14px}
.ss-list-foot{padding:var(--space-3) var(--space-4);border-top:1px solid var(--line);display:grid;gap:var(--space-2)}
.ss-meter-row{display:flex;justify-content:space-between;gap:var(--space-2);font-size:var(--text-sm);color:var(--muted)}
.ss-meter-row .ss-mono{color:var(--text)}
.ss-meter{height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.ss-meter span{display:block;height:100%;background:var(--accent);border-radius:2px}
.ss-meter span.hot{background:var(--warn)}

/* The open session. */
.ss-conv{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.ss-conv-head{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-5);min-height:64px;box-sizing:border-box;border-bottom:1px solid var(--line)}
.ss-back-btn{display:none}
.ss-conv-title{flex:1;min-width:0;display:grid;gap:3px}
.ss-title-row{display:flex;align-items:center;gap:var(--space-3);min-width:0}
.ss-title-row h2{margin:0;font-size:var(--text-lg);font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ss-pill{flex:none;display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:11px;font-size:var(--text-xs);font-weight:650;border:1px solid var(--line);color:var(--muted)}
.ss-pill span{width:6px;height:6px;border-radius:50%;background:currentColor}
.ss-pill-needs{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.ss-pill-working{color:var(--info);background:var(--info-bg);border-color:var(--info-line)}
.ss-meta{display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-sm);color:var(--muted);white-space:nowrap;overflow:hidden}
.ss-meta-branch{display:inline-flex;align-items:center;gap:4px}
.ss-meta-branch .ss-ic{width:13px;height:13px}
.ss-rename{display:flex;gap:var(--space-2);align-items:center;min-width:0}
.ss-rename .input{flex:1;min-width:0;font-size:var(--text-lg);font-weight:600}
.ss-rail-btn{display:none}
.ss-menu-wrap{position:relative;flex:none}
.ss-menu{position:absolute;right:0;top:calc(100% + 6px);min-width:180px;padding:var(--space-1);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--radius);box-shadow:var(--shadow-2);display:grid;z-index:50}
.ss-menu button{text-align:left;padding:var(--space-2) var(--space-3);background:none;border:0;border-radius:var(--radius-sm);color:var(--text);font:inherit;font-size:var(--text-md);cursor:pointer}
.ss-menu button:hover:not(:disabled),.ss-menu button:focus-visible{background:var(--surface-3)}
.ss-menu button:disabled{opacity:.5;cursor:default}
.ss-menu button.danger{color:var(--bad)}
.ss-transcript{flex:1;min-height:0;overflow-y:auto;padding:var(--space-6) var(--space-5) var(--space-4);display:flex;flex-direction:column;gap:var(--space-6)}
.ss-turn{display:flex;flex-direction:column;gap:var(--space-3)}
.ss-said{align-self:flex-end;max-width:min(78%,640px);padding:10px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px 14px 4px 14px;font-size:var(--text-md);line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.ss-answer{display:flex;flex-direction:column;gap:var(--space-2);max-width:760px;min-width:0}
.ss-summary{align-self:flex-start;display:inline-flex;align-items:center;gap:var(--space-2);padding:2px 0;background:none;border:0;color:var(--muted);font:inherit;font-size:var(--text-sm);cursor:pointer}
.ss-summary:disabled{cursor:default}
.ss-summary:not(:disabled):hover{color:var(--text)}
.ss-summary .ss-ic{width:14px;height:14px}
/* The answer is the turn's prose, not a quoted document: no frame, no scroll cap. */
.ss-md.md{background:none;border:0;padding:0;max-height:none;overflow:visible;font-size:var(--text-md);line-height:1.65}
/* The steps are a trace hung off the answer's left edge: a rule with a node per
   call, the one waiting on you drawn warm and larger than the rest. */
.ss-steps{list-style:none;margin:0 0 0 7px;padding:0 0 0 18px;border-left:1px solid var(--line);display:grid}
.ss-step{position:relative;display:flex;align-items:baseline;gap:10px;padding:4px 0;font-size:var(--text-sm);min-width:0}
.ss-step::before{content:'';position:absolute;left:-23px;top:9px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:1.5px solid var(--line-strong);box-sizing:border-box}
.ss-step-verb{color:var(--muted);flex:none;min-width:52px}
.ss-step-target{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss-step-note{flex:none;font-size:var(--text-xs);color:var(--muted)}
.ss-step-waiting,.ss-step-waiting .ss-step-verb,.ss-step-waiting .ss-step-note,.ss-step-waiting .ss-path-dir{color:var(--warn)}
.ss-step-waiting::before{background:var(--warn);border-color:var(--warn);box-shadow:0 0 0 4px var(--warn-bg);width:11px;height:11px;left:-24px;top:8px}
.ss-step-failed::before,.ss-step-denied::before,.ss-step-timed-out::before{border-color:var(--bad)}
.ss-step-failed .ss-step-note,.ss-step-denied .ss-step-note,.ss-step-timed-out .ss-step-note{color:var(--bad)}
.ss-live{display:flex;align-items:center;gap:var(--space-2);color:var(--muted);font-size:var(--text-sm)}
.ss-live .spinner-wrap{padding:0}
.ss-failure{color:var(--bad);font-size:var(--text-md);padding:var(--space-2) var(--space-3);background:var(--bad-bg);border:1px solid var(--bad-line);border-radius:var(--radius-sm)}
.ss-empty{margin:auto;max-width:360px;text-align:center;display:grid;gap:var(--space-2);font-size:var(--text-md);line-height:1.55}

/* The approval, docked to the composer: where a person's eyes already are. */
.ss-dock{padding:0 var(--space-5) var(--space-4);display:grid;gap:var(--space-2)}
.ss-scrim{display:none}
.ss-approval{border:1px solid var(--warn-line);border-radius:14px;background:var(--surface-1);box-shadow:var(--shadow-3);overflow:hidden;animation:ss-rise .18s var(--ease)}
@keyframes ss-rise{from{transform:translateY(6px);opacity:0}}
.ss-approval-grab{display:none}
.ss-approval-head{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4)}
.ss-approval-what{flex:1;min-width:0;display:grid;gap:2px}
.ss-approval-title{font-weight:650;font-size:var(--text-md);overflow-wrap:anywhere}
.ss-approval-title .ss-path-dir{font-weight:500}
.ss-approval-sub{font-size:var(--text-sm);color:var(--muted);overflow-wrap:anywhere}
.ss-approval-left{color:var(--warn);font-variant-numeric:tabular-nums}
.ss-approval-count{font-size:var(--text-sm);flex:none}
.ss-approval-cmd{margin:0 var(--space-4) var(--space-3);padding:var(--space-3);background:var(--surface-sunken);border:1px solid var(--line);border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:var(--text-sm);line-height:1.55;white-space:pre-wrap;word-break:break-word;max-height:200px;overflow:auto}
.ss-approval-note{margin:0 var(--space-4) var(--space-3);font-size:var(--text-sm);color:var(--muted)}
.ss-diff{margin:0 var(--space-4);background:var(--surface-sunken);border:1px solid var(--line);border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:var(--text-sm);line-height:1.65;max-height:min(260px,32vh);overflow:auto}
.ss-diff-line{display:flex;white-space:pre;min-width:max-content}
.ss-diff-no{width:36px;flex:none;text-align:right;padding-right:10px;color:var(--muted);user-select:none}
.ss-diff-text{padding-right:var(--space-3)}
.ss-diff-line.diff-ctx{color:var(--muted)}
.ss-diff-line.diff-hunk{color:var(--muted);background:none}
.ss-approval-foot{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-4)}
.ss-approval-foot .muted{flex:1;font-size:var(--text-sm)}
.ss-allow{background:var(--warn);color:#1a1406}
.ss-allow.ss-allow-hot{background:var(--bad);color:#1a0606}
/* What a git or gh command reaches, under the command itself. */
.ss-git{list-style:none;margin:0 var(--space-4) var(--space-3);padding:var(--space-2) var(--space-3);display:grid;gap:var(--space-1);border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-sunken);font-size:var(--text-sm)}
.ss-git.ss-git-local{border-color:var(--warn-line)}
.ss-git.ss-git-remote{border-color:var(--bad-line)}
.ss-git li{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:var(--space-2);row-gap:2px}
.ss-git-scope{flex:none;font-size:var(--text-xs);font-weight:650;border-radius:999px;padding:0 7px;border:1px solid var(--line);color:var(--muted)}
li.ss-git-local .ss-git-scope{color:var(--warn);border-color:var(--warn-line);background:var(--warn-bg)}
li.ss-git-remote .ss-git-scope{color:var(--bad);border-color:var(--bad-line);background:var(--bad-bg)}
.ss-git-warn{font-size:var(--text-xs);font-weight:650;color:var(--bad)}
.ss-ring{flex:none}
.ss-ring-track{fill:none;stroke:var(--warn-bg);stroke-width:3}
.ss-ring-fill{fill:none;stroke:var(--warn);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ss-ring.urgent .ss-ring-fill{stroke:var(--bad)}
.ss-composer{display:flex;align-items:flex-end;gap:var(--space-2);padding:6px 6px 6px var(--space-4);background:var(--surface-1);border:1px solid var(--line);border-radius:14px}
.ss-composer:focus-within{border-color:var(--accent-dim);box-shadow:0 0 0 3px var(--info-bg)}
.ss-composer textarea{flex:1;min-width:0;resize:none;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:var(--text-md);line-height:1.5;padding:7px 0;max-height:200px}
.ss-composer.locked{opacity:.65}
.ss-send{width:36px;height:36px;flex:none;border-radius:10px;border:0;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ss-send:disabled{background:var(--surface-3);color:var(--muted);cursor:default}
.ss-hint{font-size:var(--text-xs);color:var(--muted);text-align:center}
.ss-dock-foot{display:flex;align-items:center;justify-content:center;gap:var(--space-3);flex-wrap:wrap;min-width:0}
.ss-dock-foot .ss-auto+.ss-hint{margin-left:auto}
.ss-dock-foot:has(.ss-auto){justify-content:space-between}
.ss-auto{display:inline-flex;align-items:center;gap:8px;font-size:var(--text-sm);color:var(--muted);cursor:pointer;user-select:none}
.ss-auto input{position:absolute;opacity:0;width:1px;height:1px}
.ss-auto-track{width:30px;height:18px;flex:none;border-radius:9px;background:var(--surface-3);border:1px solid var(--line-strong);position:relative;transition:background .15s}
.ss-auto-track span{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.ss-auto.on{color:var(--text)}
.ss-auto.on .ss-auto-track{background:var(--warn-bg, var(--info-bg));border-color:var(--warn, var(--accent))}
.ss-auto.on .ss-auto-track span{transform:translateX(12px);background:var(--warn, var(--accent))}
.ss-auto input:focus-visible+.ss-auto-track{outline:2px solid var(--accent);outline-offset:2px}
.ss-auto-btn{margin-right:auto;white-space:nowrap}
.ss-attach{width:32px;height:32px;flex:none;margin-left:calc(-1 * var(--space-2));border-radius:9px;border:0;background:none;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ss-attach:hover:not(:disabled){background:var(--surface-2);color:var(--text)}
.ss-attach:disabled{cursor:default;opacity:.6}
.ss-composer.dropping,.ss-new-box.dropping{border-color:var(--accent);border-style:dashed;box-shadow:0 0 0 3px var(--info-bg)}
.ss-attach-tray{display:flex;flex-wrap:wrap;gap:var(--space-2);min-width:0}
.ss-new-box .ss-attach-tray{padding:var(--space-3) var(--space-4) 0}
.ss-new-bar .ss-attach{margin-left:0}
.ss-chip{display:inline-flex;align-items:center;gap:6px;max-width:220px;min-width:0;padding:4px 4px 4px 4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;font-size:var(--text-sm);color:var(--text);text-decoration:none}
.ss-chip img{width:32px;height:32px;object-fit:cover;border-radius:6px;flex:none}
.ss-chip-ext{width:32px;height:32px;flex:none;border-radius:6px;background:var(--surface-3);color:var(--muted);font-size:10px;font-weight:650;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center}
.ss-chip-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:4px}
.ss-chip button{width:22px;height:22px;flex:none;border:0;border-radius:6px;background:none;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ss-chip button:hover:not(:disabled){background:var(--surface-3);color:var(--text)}
.ss-said-files{align-self:flex-end;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:var(--space-2);max-width:min(78%,640px)}
.ss-said-files img{display:block;max-width:220px;max-height:160px;border-radius:10px;border:1px solid var(--line);object-fit:cover}
.ss-said-files video{max-width:260px;border-radius:10px}
.ss-shared-files{display:flex;flex-wrap:wrap;gap:var(--space-3);margin-top:var(--space-3);min-width:0}
.ss-shared-files figure{margin:0;display:grid;gap:4px;max-width:100%;min-width:0}
.ss-shared-files img{display:block;max-width:min(100%,520px);max-height:420px;border-radius:10px;border:1px solid var(--line);object-fit:contain;background:var(--surface-2)}
.ss-shared-files video{display:block;max-width:min(100%,520px);border-radius:10px;background:#000}
.ss-shared-files audio{display:block;width:min(100%,360px)}
.ss-shared-files figcaption{font-size:var(--text-sm);color:var(--muted)}

/* What the session has cost and changed. */
.ss-rail{border-left:1px solid var(--line);background:var(--surface-0);padding:var(--space-5) var(--space-4);overflow-y:auto;display:flex;flex-direction:column;gap:var(--space-6);min-height:0;min-width:0}
.ss-rail-head{display:none}
.ss-rail-scrim{display:none}
.ss-rail-sec{display:grid;gap:var(--space-2);min-width:0}
.ss-eyebrow{margin:0;font-size:var(--text-xs);font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ss-rail-sec-head{display:flex;align-items:center;justify-content:space-between;font-size:var(--text-sm)}
.ss-spend{display:flex;align-items:baseline;gap:var(--space-2);font-size:var(--text-sm);margin-bottom:var(--space-1)}
.ss-spend-figure{font-size:26px;font-weight:550;letter-spacing:-.02em;color:var(--text)}
.ss-files{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden}
.ss-files li{display:flex;align-items:center;gap:var(--space-2);padding:8px var(--space-3);font-size:var(--text-sm);border-bottom:1px solid var(--line);min-width:0}
.ss-files li:last-child{border-bottom:0}
.ss-files .ss-mono{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss-files .ss-file-n{flex:none}
.ss-file-mark{width:6px;height:6px;border-radius:1px;flex:none;background:var(--warn)}
.ss-file-new{background:var(--good)}
.ss-file-deleted{background:var(--bad)}
.ss-file-n{font-size:var(--text-xs)}
.ss-file-tag{font-size:var(--text-xs);color:var(--good);flex:none}
.ss-rail-empty{margin:0;font-size:var(--text-sm)}
.ss-nudge{padding:var(--space-4);border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--surface-1);display:grid;gap:var(--space-3)}
.ss-nudge-head{display:flex;align-items:center;gap:var(--space-2);color:var(--accent)}
.ss-nudge-head h3{margin:0;font-size:var(--text-md);color:var(--text);text-transform:none;letter-spacing:normal}
.ss-nudge p{margin:0;font-size:var(--text-sm);line-height:1.55;color:var(--muted)}
.ss-nudge-actions{display:flex;gap:var(--space-2)}
/* Conversation modes. Read-only is the quiet default; Can edit is marked in warn, the
   colour the approval panel already uses for "this touches your checkout". */
.ss-mode{flex:none}
.ss-mode .seg-btn{padding:var(--space-1) var(--space-3);font-size:var(--text-xs)}
.ss-mode .seg-btn.active.ss-mode-read{color:var(--info);background:var(--info-bg)}
.ss-mode .seg-btn.active.ss-mode-edit{color:var(--warn);background:var(--warn-bg)}
.ss-mode-filter{display:flex;margin-top:var(--space-2)}
.ss-mode-filter .seg-btn{flex:1;padding:var(--space-1) var(--space-2);font-size:var(--text-xs)}
.ss-mode-tag{flex:none;font-size:10.5px;font-weight:650;color:var(--warn);border:1px solid var(--warn-line);background:var(--warn-bg);border-radius:999px;padding:0 7px;line-height:17px}
.ss-row-system .ss-row-name{color:var(--muted);font-weight:500}
.ss-system-toggle{display:block;background:none;border:none;color:var(--muted);font-size:var(--text-xs);padding:var(--space-2);cursor:pointer;text-align:left}
.ss-system-toggle:hover{color:var(--text)}
.ss-lock{margin:var(--space-3) var(--space-5) 0;padding:var(--space-2) var(--space-3);border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-1);font-size:var(--text-sm);color:var(--muted)}
.ss-divider{display:flex;align-items:center;gap:var(--space-3);font-size:var(--text-xs);font-weight:600}
.ss-divider::before,.ss-divider::after{content:'';flex:1;border-top:1px solid var(--line)}
.ss-divider-edit{color:var(--warn)}
.ss-divider-read{color:var(--info)}
.ss-draft{padding:var(--space-3) var(--space-4);border:1px solid var(--info-line);border-radius:var(--radius);background:var(--surface-1);display:grid;gap:var(--space-2)}
.ss-draft-head{display:flex;align-items:center;gap:var(--space-2);color:var(--accent);min-width:0}
.ss-draft-head b{color:var(--text);flex:1;min-width:0;overflow-wrap:anywhere}
.ss-draft p{margin:0;font-size:var(--text-sm);line-height:1.55;color:var(--muted);white-space:pre-wrap}
.ss-draft-actions{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;font-size:var(--text-xs)}
.ss-facts{font-size:var(--text-sm)}
.ss-facts>div{display:flex;justify-content:space-between;gap:var(--space-3);color:var(--muted);min-width:0}
.ss-facts>div>span:last-child{color:var(--text);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ss-log{max-height:320px;overflow:auto}

/* A new session starts from what it should do. */
.ss-new-pane{overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:var(--space-7) var(--space-6);background:var(--bg);min-height:0;min-width:0}
.ss-new-inner{width:100%;max-width:640px;display:grid;gap:var(--space-6)}
.ss-back{display:none}
.ss-new-head{display:grid;gap:var(--space-2)}
.ss-new-head>.muted{font-size:var(--text-sm);overflow-wrap:anywhere}
.ss-new-head strong{color:var(--text);font-weight:600}
.ss-new-head h2{margin:0;font-size:var(--text-2xl);font-weight:650;letter-spacing:-.02em;line-height:1.2}
.ss-inline-select{display:inline-flex;vertical-align:middle}
.ss-new-box{background:var(--surface-1);border:1px solid var(--line-strong);border-radius:16px;box-shadow:var(--shadow-2)}
.ss-new-box:focus-within{border-color:var(--accent-dim);box-shadow:0 0 0 4px var(--info-bg),var(--shadow-2)}
.ss-new-box textarea{display:block;width:100%;box-sizing:border-box;padding:var(--space-4) var(--space-4) var(--space-2);background:none;border:0;outline:0;resize:none;color:var(--text);font:inherit;font-size:15px;line-height:1.6}
.ss-new-bar{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-2) var(--space-2) var(--space-3);border-top:1px solid var(--line)}
.ss-model{min-width:0;flex:0 1 auto}
.ss-new-spacer{flex:1}
.ss-kbd-hint{font-size:var(--text-xs)}
@media(pointer:coarse){.ss-kbd-hint,.ss-hint{display:none}}
.ss-facts-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-3)}
.ss-facts-grid>div{display:grid;gap:6px;align-content:start;padding:var(--space-4);border:1px solid var(--line);border-radius:var(--radius)}
.ss-facts-grid b{font-size:var(--text-md);font-weight:600}
.ss-facts-grid span{font-size:var(--text-sm);line-height:1.5;color:var(--muted)}
.ss-facts-grid .ss-ic{width:18px;height:18px;color:var(--muted)}
.ss-facts-grid .ss-ic.accent{color:var(--accent)}
.ss-facts-grid .ss-ic.warn{color:var(--warn)}
.ss-new-alt{margin:0;font-size:var(--text-sm)}
@media(prefers-reduced-motion:reduce){.ss-dot-working,.ss-approval{animation:none}.ss-ring-fill{transition:none}}

/* Chat shares the workspace: the list and one conversation, no details rail. */
.chat-row-ic{width:14px;height:14px;margin-top:3px;color:var(--muted)}
.ss-row.active .chat-row-ic{color:var(--accent)}
.chat-note{font-size:var(--text-sm);min-width:0}
.chat-waiting{display:flex;align-items:center;gap:var(--space-2) var(--space-3);flex-wrap:wrap;padding:var(--space-3) var(--space-4);border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-1);font-size:var(--text-sm);color:var(--muted)}
.chat-waiting .link{font-weight:600;text-decoration:none}
.chat-decide{display:grid;gap:var(--space-3);padding-top:var(--space-4);border-top:1px solid var(--line)}
/* Below 1280px the details leave the grid and slide over the session on demand. */
@media(max-width:1279px){
  .ss-shell-open{grid-template-columns:260px minmax(0,1fr)}
  .ss-shell-index,.ss-shell-new{grid-template-columns:260px minmax(0,1fr)}
  .ss-shell-open .ss-rail{position:absolute;top:0;right:0;bottom:0;width:min(320px,100%);box-sizing:border-box;box-shadow:var(--shadow-3);transform:translateX(100%);visibility:hidden;transition:transform .2s var(--ease),visibility .2s;z-index:40}
  .ss-shell-open .ss-rail.open{transform:none;visibility:visible}
  .ss-rail-btn{display:inline-flex}
  .ss-rail-scrim{display:block;position:absolute;inset:0;background:var(--scrim);z-index:39}
  .ss-rail-head{display:flex;align-items:center;justify-content:space-between}
  .ss-rail-head h3{margin:0;font-size:var(--text-md)}
  .ss-facts-grid{grid-template-columns:1fr}
}
/* A phone: one pane at a time, the page scrolls, the composer sticks to the
   bottom, and the approval is a sheet where the thumb is. */
@media(max-width:1000px){
  .main-col:has(.ss-shell){height:auto}
  .content:has(>.ss-shell){display:block}
  .ss-shell,.ss-shell-open,.ss-shell-index,.ss-shell-new{display:block;border:0;background:none;border-radius:0;overflow:visible}
  .ss-shell-open .ss-list,.ss-shell-new .ss-list,.ss-shell-index .ss-new-pane,.chat-open .ss-list{display:none}
  .chat-open .ss-conv{display:block}
  .ss-list{border:0;background:none}
  .ss-list-head{padding:0 0 var(--space-2)}
  .ss-list-body{padding:0;overflow:visible}
  .ss-row{padding:var(--space-3) var(--space-2)}
  .ss-list-foot{padding:var(--space-3) var(--space-2)}
  .ss-conv{background:none}
  .ss-conv-head{padding:0 0 var(--space-3);min-height:0;border-bottom:1px solid var(--line)}
  /* The mode switch takes its own row here: beside the title it left the name a word. */
  .ss-conv-head{flex-wrap:wrap}
  .ss-mode{order:10;flex:1 1 100%;display:flex}
  .ss-mode .seg-btn{flex:1}
  .ss-lock{margin:var(--space-3) 0 0}
  .ss-back-btn{display:inline-flex}
  .ss-transcript{overflow:visible;padding:var(--space-5) 0}
  .ss-said{max-width:88%}
  .ss-dock{position:sticky;bottom:0;padding:var(--space-3) 0 calc(var(--space-3) + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,var(--bg) 24px)}
  .ss-hint{display:none}
  .ss-scrim{display:block;position:fixed;inset:0;background:var(--scrim);z-index:960}
  .ss-approval{position:fixed;left:0;right:0;bottom:0;z-index:961;border-radius:20px 20px 0 0;border-width:1px 0 0;padding-bottom:env(safe-area-inset-bottom);max-height:88dvh;overflow-y:auto;animation-name:ss-sheet}
  @keyframes ss-sheet{from{transform:translateY(40px);opacity:0}}
  .ss-approval-grab{display:block;width:40px;height:4px;border-radius:2px;background:var(--line-strong);margin:var(--space-2) auto 0}
  .ss-approval-foot{display:grid;grid-template-columns:1fr 1fr;padding:var(--space-4)}
  .ss-approval-foot .muted{grid-column:1/-1}
  .ss-approval-foot .btn{min-height:48px;font-size:var(--text-lg)}
  .ss-diff{max-height:42dvh}
  .ss-shell-open .ss-rail{position:fixed;top:0;bottom:0;height:auto;z-index:970;width:min(360px,100%)}
  .ss-rail-scrim{position:fixed;z-index:969}
  .ss-new-pane{padding:0;display:block;background:none}
  .ss-back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:var(--text-sm);text-decoration:none}
  .ss-new-head h2{font-size:var(--text-xl)}
}

/* ---- app-wide approval card ----
   A conversation's permission prompt, shown on every screen but its own. Bottom
   right on a desk, where it covers least; a bottom sheet on a phone, like the
   conversation's own prompt. Below overlays and toasts, above every view. */
.approval-dock{position:fixed;right:var(--space-5);bottom:var(--space-5);z-index:880;width:min(460px,calc(100vw - 32px));max-height:calc(100dvh - 2 * var(--space-5));overflow-y:auto;display:grid;gap:var(--space-2);animation:ss-rise .18s var(--ease)}
.approval-dock-from{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-2);padding:var(--space-2) var(--space-3);background:var(--surface-2);border:1px solid var(--warn-line);border-radius:var(--radius);box-shadow:var(--shadow-2);font-size:var(--text-sm);min-width:0}
.approval-dock-dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none;animation:approval-pulse 1.4s ease-in-out infinite}
@keyframes approval-pulse{50%{opacity:.35}}
.approval-dock-name{font-weight:650;overflow-wrap:anywhere}
.approval-dock-open{margin-left:auto;color:var(--accent);text-decoration:none;white-space:nowrap}
.approval-dock-later{padding-inline:var(--space-2)}
.approval-dock-open:hover{text-decoration:underline}
/* The shrunk form: top centre, where nothing in a view keeps a control. */
.approval-pill{position:fixed;top:var(--space-4);left:50%;transform:translateX(-50%);z-index:880;display:flex;align-items:center;gap:var(--space-2);max-width:calc(100vw - 32px);padding:var(--space-2) var(--space-3);background:var(--surface-2);color:var(--text);border:1px solid var(--warn-line);border-radius:999px;box-shadow:var(--shadow-2);font:inherit;font-size:var(--text-sm);cursor:pointer;white-space:nowrap}
.approval-pill .approval-dock-name{overflow:hidden;text-overflow:ellipsis}
.approval-pill-go{color:var(--warn);font-weight:650}
.approval-pill:hover{border-color:var(--warn)}
@media(prefers-reduced-motion:reduce){.approval-dock,.approval-dock-dot{animation:none}}
@media(max-width:1000px){
  .approval-dock{left:0;right:0;bottom:0;width:auto;max-height:88dvh;gap:0;background:var(--surface-1);border-top:1px solid var(--warn-line);border-radius:20px 20px 0 0;box-shadow:var(--shadow-3)}
  .approval-dock-from{border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;background:none;padding:var(--space-3) var(--space-4)}
  .approval-dock .ss-approval{position:static;max-height:none;border:0;border-radius:0;box-shadow:none;animation:none}
}

/* ---- data table ---- */
.data-table{width:100%;border-collapse:collapse}
.data-table th,.data-table td{padding:var(--space-3);border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.data-table th{color:var(--muted);font-weight:600;font-size:var(--text-sm);user-select:none}
.data-table th.sortable{cursor:pointer}
.data-table th.sortable:hover{color:var(--text)}
.sort-arrow{margin-left:var(--space-1);font-size:var(--text-xs)}
/* A link inside a table cell is the row's subject, not a footnote: it takes the
   app's accent but not the browser's default blue, and it is underlined only when
   pointed at, so a column of titles does not read as a column of underlines. */
.data-table td a{color:var(--accent);text-decoration:none}
.data-table td a:hover{text-decoration:underline}
.data-table td a.muted{color:var(--muted)}
.data-table td a.muted:hover{color:var(--text)}
.data-table tr.clickable{cursor:pointer}
.data-table tr.clickable:hover td{background:var(--surface-2)}
/* The row the arrow keys are on. Same wash as hover, so pointer and keyboard land
   on the same affordance. */
.data-table tr.focused td{background:var(--surface-2);box-shadow:inset 2px 0 0 var(--accent)}
/* The header stays put while a long table scrolls under it. The background is not
   decoration: a sticky cell shows the rows behind it without one. */
.data-table thead th{position:sticky;top:0;background:var(--surface-1);z-index:1}
.data-table:focus-visible{outline:2px solid var(--accent-dim);outline-offset:-2px}

@media(max-width:1000px){
  .app-shell,.app-shell.collapsed{grid-template-columns:1fr}
  /* The sidebar becomes an off-canvas drawer behind the header hamburger. Fixed
     rather than in flow, so the grid's one column is the page and the drawer slides
     over it. */
  .sidebar{
    position:fixed;top:0;bottom:0;left:0;
    width:280px;max-width:85vw;
    height:auto; /* top+bottom bound it; 100vh mis-measures under mobile URL bars */
    /* The rail sets `align-self:start`, which for a fixed box with top and bottom
       at 0 is what decides whether an auto height stretches between them or
       shrinks to its contents. The drawer is the whole screen edge, so it
       stretches. */
    align-self:stretch;
    z-index:950;
    transform:translateX(-105%);
    visibility:hidden; /* off-canvas links stay out of tab order and the a11y tree */
    transition:transform .18s ease,visibility 0s linear .18s;
    box-shadow:var(--shadow-3);
  }
  .app-shell.nav-open .sidebar{transform:translateX(0);visibility:visible;transition:transform .18s ease}
  .nav-backdrop{display:block;position:fixed;inset:0;background:var(--scrim);z-index:940} /* the kbd-overlay dim */
  .nav-toggle{display:inline-flex;align-items:center;justify-content:center}
  .sidebar-toggle{display:none} /* collapsing is a desktop rail concept; the drawer is always expanded */
  /* The drawer must not inherit the icon-only rail from a desktop collapse (the
     preference persists in localStorage): re-expand it. */
  .app-shell.collapsed .logo-text,.app-shell.collapsed .nav-group-label,.app-shell.collapsed .nav-item-label{display:block}
  .app-shell.collapsed .logo{justify-content:flex-start;padding:0 var(--space-3) var(--space-6)}
  .app-shell.collapsed .nav-item{justify-content:flex-start;gap:var(--space-3);padding:var(--space-2) var(--space-3)}
  .app-shell.collapsed .nav-group{margin-top:var(--space-4);padding-top:0;border-top:0}
  .metric-grid,.provider-grid,.grid3{grid-template-columns:1fr 1fr}
  .chart-grid{grid-template-columns:1fr}
  .app-header,.content{padding-left:var(--space-5);padding-right:var(--space-5)}
}
/* The drawer's slide, for a reader who asked for reduced motion. Here rather than
   with the skeleton rule at the top of the file - where a bare `.sidebar` would be
   dead - for two reasons: the 1000px block above is what declares that transition,
   and the rule in force at the moment the drawer appears is the heavier
   `.app-shell.nav-open .sidebar`, so an override has to come after both and name
   both. */
@media(max-width:1000px) and (prefers-reduced-motion:reduce){
  .sidebar,.app-shell.nav-open .sidebar{transition:none}
}
@media(max-width:650px){
  /* Metric cards stay paired - four full-width count cards is a lot of scroll
     for four short numbers. Everything else goes single column. */
  .metric-grid{grid-template-columns:1fr 1fr}
  .provider-grid,.grid3,.chart-grid{grid-template-columns:1fr}
  .list-row{flex-direction:column;align-items:flex-start}
  .kv-grid{grid-template-columns:1fr}
  .app-header,.content{padding-left:var(--space-4);padding-right:var(--space-4)}
  .app-header{padding-top:var(--space-4)}
  /* Menu, title, status, search and New task do not fit one 390px row: kept on one,
     the title shrinks to nothing and New task runs off the edge. The actions take a
     row of their own instead, with search taking the slack. */
  .app-header{flex-wrap:wrap;row-gap:var(--space-3)}
  .header-actions{flex:1 1 100%}
  .header-actions .search-trigger{flex:1;justify-content:space-between}
  .content{padding-bottom:var(--space-7)}
  .header-title{font-size:var(--text-xl)}
  .metric-value{font-size:var(--text-xl)}
  /* Long titles and paths must break rather than widen the page. */
  .list-row-main{min-width:0}
  .list-row-main b,.list-row-main span{overflow-wrap:anywhere}
  .list-row-side{flex-wrap:wrap}
  .view-toolbar{gap:var(--space-2)}
  .tasks-actions .search-input{flex-basis:100%;max-width:none}
  .inline-form-grid{grid-template-columns:1fr}
  /* The toggle moves to a line of its own rather than taking a third of the strip
     and squeezing the tabs into a scroller two tabs wide. */
  .tasks-tabs{flex-wrap:wrap}
  .tasks-tabs .tabs{flex-basis:100%}
  .tasks-tabs .switch{margin-left:auto}
  .kbd-overlay{padding:var(--space-6) var(--space-3)}
  /* Toasts are fixed, so an oversized one is clipped rather than scrolled -
     pin them to the viewport edges instead. */
  .toast-stack{top:var(--space-3)}
  .toast{min-width:0;max-width:none}
  .data-table th,.data-table td{padding:var(--space-2)}
  .md th,.md td{padding:var(--space-2)}
  /* A wide table gets its own horizontal scroll instead of pushing the whole
     page sideways. Chart cards are excluded on purpose: a scroll container on
     one axis forces the other to auto, which would clip the chart tooltip. */
  .card:not(:has(.chart-figure)):not(.dialog){overflow-x:auto;overscroll-behavior-x:contain}
  /* The chat card is a fixed shell whose transcript is already the scroll
     container, so neither the narrow-screen card padding nor the wide-content
     scroll rule above applies to it. Written after that rule and at its
     specificity, because both would otherwise win on source order. */
}
/* Narrow phones: a two-up metric row leaves too little room for the value. The
   figure is already at --text-xl from the 650px block above, so only the grid
   changes here. */
/* ---- touch ----
   A finger is not a mouse. The desktop sizes above are set for a pointer that lands
   on a pixel; on a coarse pointer every control grows to roughly the 44px that a
   fingertip actually covers, and the tabs - which are the main navigation on a task
   page and were the tightest targets in the app - get a little more room than that. */
@media(pointer:coarse){
  .btn,.seg-btn,.tab,.nav-item,.input,.switch,.icon-btn{min-height:44px}
  .icon-btn{width:44px}
  .tab{padding:var(--space-3) var(--space-4)}
  /* ⌘K names a key a touch screen does not have. */
  .search-trigger .kbd-keys{display:none}
  /* Every field in the app carries `.input`, selects and textareas included. */
  /* A tap leaves a hover style stuck until the next tap lands elsewhere. Both
     halves of the hover have to be dropped: the wash and the brightness lift. */
  .btn:hover,.tab:hover,.seg-btn:hover{opacity:1;filter:none}
  .btn.ghost:hover{background:transparent;color:var(--muted)}
}
/* ---- installed ----
   `viewport-fit=cover` puts the page under the status bar and the home indicator, so
   the header and the content have to clear them by hand. Zero on every display that
   has no inset, which is why these are safe unconditionally. */
@supports(padding:env(safe-area-inset-top)){
  .app-header{padding-top:calc(var(--space-5) + env(safe-area-inset-top))}
  .content{padding-bottom:calc(var(--space-6) + env(safe-area-inset-bottom))}
  .sidebar{padding-top:calc(var(--space-6) + env(safe-area-inset-top))}
}
/* ---- pairing ----
   The only screen a phone sees before it has a token, so it is centred and narrow
   rather than inheriting the dashboard's layout: there is no sidebar to show and
   nothing to navigate to. */
.token-gate{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:var(--space-5)}
.token-card{display:flex;flex-direction:column;gap:var(--space-3);width:100%;max-width:360px;padding:var(--space-6)}
.token-card .logo-title{font-size:var(--text-xl)}
.token-card .logo-mark{width:24px;height:24px}
.token-hint{margin:0;font-size:var(--text-md);line-height:1.55;color:var(--muted)}
.token-hint code{color:var(--text);background:var(--surface-3);padding:1px var(--space-1);border-radius:4px;overflow-wrap:anywhere}
.token-error{font-size:var(--text-md);color:var(--bad)}
/* ---- server control ----
   The stopped panel shares the pairing screen's centring, because it is the same
   kind of screen: one card, one thing to do, nothing else to navigate to. The dot
   is the same 8px mark the provider cards use, under its own name - the header
   carries one too, and it is the dashboard's own machine that it reports on. */
.server-panel{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:var(--space-5)}
.server-card{display:flex;flex-direction:column;gap:var(--space-3);width:100%;max-width:440px;padding:var(--space-6)}
.server-card .logo-title{font-size:var(--text-xl)}
.server-card .logo-mark{width:24px;height:24px}
.server-card p{margin:0;font-size:var(--text-md);line-height:1.55}
.server-card code{color:var(--text);background:var(--surface-3);padding:1px var(--space-1);border-radius:4px;overflow-wrap:anywhere}
.server-status{display:flex;align-items:center;gap:var(--space-2);font-weight:650}
.status-dot{display:inline-block;flex:0 0 auto;width:8px;height:8px;border-radius:50%}
.status-dot.good{background:var(--good)}
.status-dot.warn{background:var(--warn)}
.status-dot.bad{background:var(--bad)}
/* In the header it follows the title, so it needs the gap the title does not have. */
.header-title>.status-dot{margin-left:var(--space-3);vertical-align:middle}

/* ---- Task page: the next-step bar, the one home of the task's main action. ---- */
.next-bar{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-4);background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius)}
.next-bar.tone-bad{border-color:var(--bad-line)}
.next-bar.tone-warn{border-color:var(--warn-line)}
.next-bar-icon{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--info-bg);border:1px solid var(--info-line);color:var(--info)}
.next-bar-icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tone-good>.next-bar-icon{background:var(--good-bg);border-color:var(--good-line);color:var(--good)}
.tone-bad>.next-bar-icon{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.tone-warn>.next-bar-icon{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.next-bar-spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
.next-bar-text{flex:1;min-width:0;display:grid;gap:2px}
.next-bar-text b{font-size:var(--text-md);font-weight:650}
.next-bar-text span{font-size:var(--text-sm);color:var(--muted);line-height:1.45;overflow-wrap:anywhere}
.next-bar-actions{display:flex;gap:var(--space-2);flex-wrap:wrap;justify-content:flex-end;flex:none}
@media(prefers-reduced-motion:reduce){.next-bar-spin{animation-duration:2s}}

/* The description, clamped once it runs long and opened by the link under it. */
.task-description:not(.open){display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.task-description-toggle{display:block;margin-top:var(--space-1);text-decoration:none}
.plan-meta{font-size:var(--text-sm)}

/* ---- Execute ---- */
.exec-tree{display:grid;gap:0;padding:0}
.exec-tree-row{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;padding:var(--space-3) var(--space-4);font-size:var(--text-md)}
.exec-tree-row>.ss-ic{color:var(--muted)}
.exec-tree-row+.exec-tree-row{border-top:1px solid var(--line)}
.exec-tree-path{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40ch}
.exec-tree-base{font-size:var(--text-sm)}
.exec-runs{display:grid;gap:var(--space-3)}
.exec-runs-head{display:flex;align-items:baseline;gap:var(--space-3);flex-wrap:wrap}
.exec-runs-head h2{margin:0;font-size:var(--text-lg)}
.exec-runs-head .muted{font-size:var(--text-sm)}
.exec-timeline{list-style:none;margin:0;padding:0;display:grid}
.exec-step{position:relative;display:grid;grid-template-columns:14px 110px minmax(0,1fr) auto;gap:var(--space-3);align-items:baseline;padding:var(--space-2) 0;font-size:var(--text-md)}
.exec-step:not(:last-child)::after{content:"";position:absolute;left:4px;top:24px;bottom:-8px;width:2px;background:var(--line)}
.exec-dot{width:10px;height:10px;border-radius:50%;background:var(--muted);align-self:center}
.exec-dot.good{background:var(--good)}.exec-dot.bad{background:var(--bad)}.exec-dot.info{background:var(--info);animation:pulse 1.4s ease-in-out infinite}
.exec-what{font-size:var(--text-sm);min-width:0;overflow-wrap:anywhere}
.exec-what .good{color:var(--good)}.exec-what .bad{color:var(--bad)}.exec-what .info{color:var(--info)}
.exec-when{font-size:var(--text-sm);white-space:nowrap}

/* ---- Review: verdict, findings, the decision ---- */
.review-icon.tone-good{background:var(--good-bg);border-color:var(--good-line);color:var(--good)}
.review-icon.tone-warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.review-icon.tone-bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.review-eyebrow{margin:0;font-size:var(--text-xs);font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.review-eyebrow.warn{color:var(--warn)}
.review-findings{border-top:1px solid var(--line);padding:var(--space-4) var(--space-5);display:grid;gap:var(--space-3);min-width:0}
.review-md{font-size:var(--text-md);line-height:1.6}
.review-findings>.md,.review-msg>.md{background:none;border:0;padding:0;max-height:none;overflow:visible}
.review-msg>.md>:first-child{margin-top:0}.review-msg>.md>:last-child{margin-bottom:0}
.review-fold{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;width:100%;min-height:48px;padding:var(--space-2) var(--space-5);background:none;border:0;border-top:1px solid var(--line);color:var(--text);font:inherit;font-size:var(--text-md);text-align:left;cursor:pointer}
.review-fold:hover{background:var(--surface-2)}
.review-fold .ss-ic{width:14px;height:14px;color:var(--muted)}
.review-fold .ss-ic.open{transform:rotate(90deg)}
.review-fold .muted{font-size:var(--text-sm)}
.review-feedback{padding:0 var(--space-5) var(--space-4);display:grid;gap:var(--space-3)}
.review-feedback-actions{justify-content:flex-end}
.review-decision-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:var(--space-4);align-items:start}
.review-decision-grid>:only-child{grid-column:1/-1}
.review-question{display:grid;gap:var(--space-3);border-color:var(--warn-line)}
.review-question-text{margin:0;font-size:var(--text-lg);font-weight:600;line-height:1.4}
.review-options{display:grid;gap:var(--space-2)}
.review-option{display:flex;align-items:flex-start;gap:var(--space-3);width:100%;padding:var(--space-3);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);color:var(--text);font:inherit;text-align:left;cursor:pointer}
.review-option:hover{border-color:var(--line-strong)}
.review-option.on{border-color:var(--accent);background:var(--surface-3)}
.review-option>span:last-child{display:grid;gap:2px;font-size:var(--text-md)}
.review-option .muted{font-size:var(--text-sm)}
.review-radio{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-strong);flex:none;margin-top:2px}
.review-option.on .review-radio{border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--surface-3);background:var(--accent)}
.review-rec{margin:0;font-size:var(--text-sm)}
.review-foot-inset{padding:0;border-top:0;background:none}
.review-thread{display:grid;gap:var(--space-3);max-height:560px;overflow:auto}
.review-msg{display:grid;gap:4px;padding:var(--space-3);border-radius:var(--radius-sm);background:var(--surface-2)}
.review-msg.mine{background:var(--surface-3)}
.review-msg>.muted{font-size:var(--text-sm)}

/* ---- Port ---- */
.port-verdict{border-left-width:3px}
.port-verdict.tone-good{border-left-color:var(--good)}
.port-verdict.tone-warn{border-left-color:var(--warn)}
.port-verdict.tone-bad{border-left-color:var(--bad)}
.port-verdict.tone-neutral{border-left-color:var(--accent-dim)}
.port-verdict p{margin:0}
.port-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-4);align-items:start}
.port-grid-wide{grid-template-columns:minmax(0,1fr) 320px}
/* Details and the change each take the full width: the change carries its own file
   list beside the diff, and a column beside that would leave the code a third of it.
   Details runs across as a strip of facts instead. */
.port-details,.port-change{display:grid;gap:var(--space-3);min-width:0}
.port-details h3,.port-change h3{margin:0}
.port-details .port-dl{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--space-3) var(--space-5)}
.port-grid>:only-child{grid-column:1/-1}
.port-grid>.card{display:grid;gap:var(--space-3);min-width:0}
.port-grid h3{margin:0}
.port-tests-note{font-size:var(--text-sm);margin:0}
.port-cmd{display:flex;align-items:flex-start;gap:var(--space-2);margin-top:var(--space-2)}
.port-cmd{align-items:center}.port-cmd>pre.code-block{flex:1;min-width:0;margin:0;overflow-x:auto}
.port-dl{margin:0;display:grid;gap:var(--space-3)}
.port-dl-row{display:grid;gap:2px}
.port-dl dt{font-size:var(--text-xs);font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.port-dl dd{margin:0;font-size:var(--text-md);overflow-wrap:anywhere}

/* ---- Activity: grouped by the run that wrote it ---- */
.act{position:relative;display:grid;gap:var(--space-3)}
.act-bar{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap}
.act-search{flex:1 1 200px;max-width:320px}
.act-bar>.link-btn{margin-left:auto;text-decoration:none}
.act-count{color:var(--bad)}
.act-notice{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;font-size:var(--text-sm);color:var(--muted)}
.act-notice .link-btn{text-decoration:none}
.act-box{max-height:640px;overflow:auto;display:grid;gap:var(--space-2);align-content:start;overscroll-behavior:contain}
.act-empty{margin:0;padding:var(--space-4)}
.act-group{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius)}
.act-group.bad{border-color:var(--bad-line)}
.act-head{display:flex;align-items:center;gap:var(--space-3);width:100%;min-height:52px;padding:var(--space-2) var(--space-4);background:none;border:0;color:var(--text);font:inherit;text-align:left;cursor:pointer;position:sticky;top:0;z-index:1;background:var(--surface-1);border-radius:var(--radius)}
.act-head[aria-expanded="true"]{border-bottom:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0}
.act-head-text{flex:1;min-width:0;display:grid;gap:2px}
.act-head-text b{font-size:var(--text-md)}
.act-head-text .muted{font-size:var(--text-sm)}
.act-dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-3);color:var(--muted)}
.act-dot svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act-dot.tone-good{background:var(--good-bg);color:var(--good)}
.act-dot.tone-bad{background:var(--bad-bg);color:var(--bad)}
.act-dot.tone-live{background:var(--info-bg);color:var(--info)}
.act-dot .next-bar-spin{width:10px;height:10px}
.act-chev{width:14px;height:14px;color:var(--muted)}
.act-chev.open{transform:rotate(90deg)}
.act-rows{list-style:none;margin:0;padding:var(--space-2) var(--space-4) var(--space-3);display:grid;gap:2px}
.act-row{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:var(--space-3);align-items:baseline;padding:4px 0;font-size:var(--text-md)}
.act-kind{font-size:var(--text-xs);font-weight:600;color:var(--muted)}
.act-text{min-width:0;overflow-wrap:anywhere}
.act-time{font-size:var(--text-xs);font-variant-numeric:tabular-nums;white-space:nowrap}
.act-row.kind-tool .act-text,.act-row.kind-run .act-text{font-family:var(--font-mono);font-size:var(--text-sm)}
.act-row.kind-think .act-text,.act-row.kind-said .act-text{color:var(--muted)}
.act-row.kind-limit .act-kind{color:var(--warn)}
.act-row.kind-done .act-kind{color:var(--good)}
.act-row.kind-error{background:var(--bad-bg);border-radius:var(--radius-sm);padding:6px var(--space-2);margin:2px calc(-1 * var(--space-2))}
.act-row.kind-error .act-kind{color:var(--bad)}
.act-console pre{margin:4px 0;padding:var(--space-2) var(--space-3);background:var(--surface-sunken);border:1px solid var(--line);border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:var(--text-xs);line-height:1.5;max-height:240px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.act-run-link{display:flex;align-items:center;min-height:40px;padding:0 var(--space-4);border-top:1px solid var(--line);font-size:var(--text-sm);font-weight:600;color:var(--accent);text-decoration:none}
.act .jump-btn{position:absolute;bottom:var(--space-3);left:50%;transform:translateX(-50%);margin:0}

@media(max-width:900px){
  .review-decision-grid,.port-grid,.port-grid-wide{grid-template-columns:minmax(0,1fr)}
  .exec-step{grid-template-columns:14px minmax(0,1fr) auto}
  .exec-step .exec-what{grid-column:2/-1;grid-row:2}
}
@media(max-width:650px){
  .next-bar{flex-wrap:wrap;gap:var(--space-3)}
  .next-bar-text{flex-basis:calc(100% - 48px)}
  .next-bar-actions{flex-basis:100%;display:flex;flex-wrap:wrap}
  .next-bar-actions .btn{flex:1 1 0;min-width:0}
  .next-bar-actions .btn.primary{flex-basis:100%}
  .next-bar-actions .btn{min-height:48px}
  .task-description:not(.open){display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .view-task-detail .tabs{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 40px),transparent)}
  .act-seg{display:flex;width:100%}
  .act-seg .seg-btn{flex:1;min-height:40px}
  .act-search{max-width:none}
  .act-row{grid-template-columns:minmax(0,1fr) auto}
  .act-row .act-kind{grid-column:1/-1}
  .review-findings,.review-fold,.review-feedback{padding-left:var(--space-4);padding-right:var(--space-4)}
  .port-cmd{flex-direction:column;align-items:stretch}
  .exec-tree-path{max-width:100%}
}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/app.mjs"></script>
<script>
  // Registered here rather than from app.mjs so it happens on the first paint rather
  // than after the module graph has resolved - and it is a no-op wherever it cannot
  // work: `serviceWorker` is absent outside a secure context, which is the plain-http
  // tailnet address the README calls a debug-only fallback.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
