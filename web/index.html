<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>AI Code — Mission Control</title>
<!-- Installable on a phone. The manifest is served from the same origin as the
     dashboard, so the installed app and the browser tab are the same application
     against the same API - which is the whole reason this is a PWA and not a second
     client to keep in sync. -->
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icons/icon-192.png" type="image/png" />
<!-- iOS reads neither the manifest's icons nor its theme colour, so it is told
     separately. `black-translucent` is what puts the page under the status bar once
     it is installed, which is what makes the header look like an app's. -->
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0a0c10" />
<script type="importmap">
{
  "imports": {
    "preact": "https://cdn.jsdelivr.net/npm/preact@10/dist/preact.module.js",
    "preact/hooks": "https://cdn.jsdelivr.net/npm/preact@10/hooks/dist/hooks.module.js",
    "htm": "https://cdn.jsdelivr.net/npm/htm@3/dist/htm.module.js",
    "marked": "https://cdn.jsdelivr.net/npm/marked@15.0.12/lib/marked.esm.js",
    "dompurify": "https://cdn.jsdelivr.net/npm/dompurify@3.4.15/dist/purify.es.mjs",
    "@xterm/xterm": "https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/lib/xterm.mjs",
    "@xterm/addon-fit": "https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.11.0/lib/addon-fit.mjs",
    "highlight.js": "https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.11.1/es/highlight.min.js",
    "ai-code/format": "/shared/format.mjs"
  }
}
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.css" />
<style>
:root{
  --bg:#0a0c10;
  --text:#edf2f7;
  --muted:#8e9aaa;
  --accent:#9fb9ff;
  --accent-dim:#4a6fa5;
  /* The ink a filled accent button is read in. Near-black rather than pure black,
     so the fill and the label share the theme's blue cast. */
  --on-accent:#0b0d10;
  --radius:10px;
  --radius-sm:6px;

  /* ---- faces ----
     Two, and the whole app is one of them. Everything a person reads is the UI
     face; a machine value - a hash, a path, a diff, a command - is the mono face,
     which is also why the distinction is worth a token: a field that shows prose
     must not be given the mono one by accident. */
  --font-ui:-apple-system,BlinkMacSystemFont,"Inter",ui-sans-serif,system-ui,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  /* ---- type scale ----
     Six steps, and every font-size in this sheet is one of them. The scale is
     dense between 11 and 14px because that is where the app's chrome lives - a
     label, a table head, a keycap, a count - and open above it, where only titles
     sit. A size that is not a step is a size nobody chose. */
  --text-xs:11px;
  --text-sm:12.5px;
  --text-md:14px;
  --text-lg:16px;
  --text-xl:20px;
  --text-2xl:28px;

  /* ---- surfaces ----
     Depth is a step on this ramp, not a hex per panel. A surface is named for how
     far it sits from the page: sunken is below it (code, a diff), 1 is the page's
     own panel, and 3 is something floating over it (a toast, a dialog). The rail
     is chrome rather than elevation and holds its own value. */
  --surface-sunken:#090b0e;
  --surface-0:#0b0e12;
  --surface-1:#11151b;
  --surface-2:#171c23;
  --surface-3:#1d232c;
  --surface-rail:#0d1014;
  --line:#29313c;
  --line-strong:#39424f;
  /* Hover on a row that has no surface of its own: a wash of the ink, so it reads
     over any surface the row happens to sit on. */
  --wash:rgba(255,255,255,.02);
  /* The dim behind an overlay. One value for the palette, the legend and the phone
     drawer, so every modal dims the page by the same amount. */
  --scrim:rgba(4,6,9,.62);

  /* ---- elevation ----
     Three heights. 1 is a card resting on the page, 2 is something over content
     that stays in the flow (a tooltip, a toast), 3 is a full overlay. */
  --shadow-1:0 1px 2px rgba(0,0,0,.30);
  --shadow-2:0 6px 20px rgba(0,0,0,.40);
  --shadow-3:0 20px 60px rgba(0,0,0,.50);

  /* ---- tones ----
     Four semantics, each as a text colour, a tinted fill and a border. The fill is
     translucent so it reads on any surface, and every `-line` is a darkened form
     of its own ink rather than a separate hue. `info` is the one state that waits
     on a person, and it is deliberately not the accent: the accent is what the app
     offers to do, and this is what the app is waiting for. */
  --good:#6fe0a1;
  --good-bg:rgba(111,224,161,.10);
  --good-line:#2c5c46;
  --warn:#ffd37a;
  --warn-bg:rgba(255,211,122,.10);
  --warn-line:#5c4f2c;
  --bad:#ff8585;
  --bad-bg:rgba(255,133,133,.10);
  --bad-line:#5c2c2c;
  --info:#9fb9ff;
  --info-bg:rgba(159,185,255,.10);
  --info-line:#4a6fa5;

  /* ---- motion ----
     One easing and one duration for every micro-interaction in the app. Anything
     longer than this is an animation - a shimmer, a slide, a spinner - and carries
     its own timing where it is declared. */
  --ease:cubic-bezier(.2,.7,.3,1);
  --dur-fast:.12s;

  /* ---- spacing scale ----
     Every gap, pad and offset in the stylesheet is a step on this scale, which is
     what makes the rhythm read as one system rather than as a pile of nearby
     numbers. A value below 4px is chrome rather than rhythm - a keycap's inset, a
     badge's padding, a hairline offset - and stays a literal; so does anything
     above 40px, which is layout geometry (an overlay's top inset, a pane's max
     height) and not spacing at all. */
  --space-1:4px;
  --space-2:8px;
  --space-3:12px;
  --space-4:16px;
  --space-5:20px;
  --space-6:24px;
  --space-7:32px;

  /* ---- chart tokens ----
     Categorical hues in fixed slot order (never cycled, never generated), plus
     the chrome the inline SVG charts draw against. Both the eight hues and the
     chrome were validated against this theme's --surface-1: every slot sits
     inside the dark lightness band, clears the chroma floor, holds >= 3:1
     contrast on the surface, and the worst adjacent pair clears the CVD and
     normal-vision separation floors. Chart 1 is the default single-series hue. */
  --chart-surface:#11151b;
  --chart-grid:#242b35;
  --chart-axis:#39424f;
  --chart-1:#3987e5;
  --chart-2:#d95926;
  --chart-3:#199e70;
  --chart-4:#c98500;
  --chart-5:#d55181;
  --chart-6:#008300;
  --chart-7:#9085e9;
  --chart-8:#e66767;
  /* A series past the last categorical slot folds into "Other" and wears this
     neutral instead of a generated hue. It clears 3:1 on --chart-surface. */
  --chart-other:#8e9aaa;

  /* ---- syntax ----
     The diff viewer's code colours. Kept off the add and delete hues on purpose: a
     line's green or red tint says what happened to it, and a token painted the same
     colour would read as part of that. Each clears 4.5:1 on --surface-sunken. */
  --syn-keyword:#c49bff;
  --syn-function:#82aaff;
  --syn-string:#e8c27a;
  --syn-number:#f5a26f;
  --syn-type:#7fd8cf;
  --syn-attr:#9fb9ff;
  --syn-tag:#f28b82;
  --syn-comment:#7d8796;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:var(--text-md)/1.5 var(--font-ui);
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0 0 var(--space-2);font-weight:650}
h1{font-size:var(--text-xl)}
h2{font-size:var(--text-lg);color:var(--text)}
h3{font-size:var(--text-md);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
/* The browser's default margins are for a document, not for an app: a paragraph
   or a figure inside a grid or flex container never has a neighbour to collapse
   with, so the ~16px it carries is added to the container's own gap. Every
   rhythm in this sheet is a step on the spacing scale, and these were the one
   place a number neither declared nor chosen leaked in. */
p{margin:0}
pre{margin:0}
figure{margin:0}
/* Headings in a flex header: the header's own gap is the space, and the 8px
   under a heading would be added to it. Descendant rather than child, because
   project.mjs nests its h1 one div deep in the toolbar. */
.view-toolbar :is(h1,h2,h3),.provider-card-head :is(h1,h2,h3),.kbd-legend-head :is(h1,h2,h3){margin:0}
code{font-family:var(--font-mono);font-size:var(--text-sm)}
.muted{color:var(--muted)}
.link{color:var(--accent);text-decoration:none;font-weight:600}
.link:hover{text-decoration:underline}

/* ---- app shell ---- */
.app-shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
/* The nav stays put while the page scrolls, the same way a table header does.
   `align-self:start` is what makes sticky possible at all: a grid item stretches
   to its row by default, and a stretched item has no travel room to stick in.
   `height:100vh` bounds the pinned rail to the window and `overflow-y:auto` lets
   the nav scroll inside it when the window is shorter than the nav. */
.sidebar{border-right:1px solid var(--line);padding:var(--space-6) var(--space-4);background:var(--surface-rail);display:flex;flex-direction:column;position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto}
.logo{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-2);padding:0 var(--space-3) var(--space-6)}
.sidebar-toggle{background:none;border:0;color:var(--muted);padding:var(--space-1) var(--space-2);border-radius:var(--radius-sm);font-size:var(--text-md);line-height:1;flex:0 0 auto}
.sidebar-toggle:hover{background:var(--surface-2);color:var(--text)}
/* The wordmark in sentence case. Shouted capitals on a product name is a costume,
   and this one is worn by a tool a person keeps open all day. */
.logo-title{display:flex;align-items:center;gap:var(--space-2);font-weight:700;font-size:var(--text-lg);letter-spacing:0}
.logo-mark{color:var(--accent);flex:0 0 auto}
.logo-sub{font-size:var(--text-sm);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);color:var(--muted);text-decoration:none;font-weight:550;font-size:var(--text-md)}
.nav-icon{flex:0 0 auto;display:block}
.nav-item-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--surface-2);color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
.nav-group{margin-top:var(--space-4)}
.nav-group:first-of-type{margin-top:0}
.nav-group-label{font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:0 var(--space-3) var(--space-2)}
.logo-text{min-width:0}
/* Collapsed: the labels go, the icons stay. Both states render the same markup -
   the label is hidden rather than swapped out - so the rail cannot drift from
   the expanded sidebar. `title` on each link is the tooltip that names a
   destination the icon alone only suggests, and it is also the link's accessible
   name while the label is out of the tree. The group headings become hairline
   rules, since the sections they name are what the rail would otherwise lose. */
.app-shell.collapsed{grid-template-columns:64px 1fr}
.app-shell.collapsed .logo-text,.app-shell.collapsed .nav-group-label,.app-shell.collapsed .nav-item-label{display:none}
.app-shell.collapsed .logo{justify-content:center;padding:0 0 var(--space-5)}
.app-shell.collapsed .nav-item{justify-content:center;gap:0;padding:var(--space-2)}
.app-shell.collapsed .nav-group{margin-top:var(--space-3);padding-top:var(--space-3);border-top:1px solid var(--line)}
.app-shell.collapsed .nav-group:first-of-type{margin-top:0;padding-top:0;border-top:0}
.main-col{display:flex;flex-direction:column;min-width:0}
/* The header is a row at every width, not only under 1000px. It carries the
   page's subject on the left and the two things a person wants from anywhere on
   the right - search and a new task - so the same layout serves both. */
.app-header{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-6) var(--space-7) 0;max-width:1550px;width:100%}
.header-title{flex:1;font-size:var(--text-xl);font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* The actions never shrink and never wrap: they are the two affordances the shell
   promises on every screen, and a squeezed button is a missing one. */
.header-actions{display:flex;align-items:center;gap:var(--space-2);flex:0 0 auto}
.search-trigger{font-weight:500;color:var(--muted)}
.search-trigger:hover{color:var(--text)}
.search-trigger .kbd{height:18px;min-width:18px;font-size:var(--text-xs);padding:0 4px}
/* Breadcrumb: the section, then the page's own subject when it has one. Muted and
   smaller, so the pair reads as depth rather than as two titles. */
.header-sep{color:var(--muted);margin:0 var(--space-2);font-weight:400}
.header-crumb{color:var(--muted);font-weight:550;font-size:var(--text-lg)}
.content{padding:var(--space-5) var(--space-7) var(--space-7);max-width:1550px;width:100%}

/* ---- primitives ---- */
/* A card sits on the page rather than in it, so it takes the first elevation step
   and a border. The shadow is what separates two panels of the same colour when
   one is nested in the other; on the page's own background it reads as depth
   rather than as a line. */
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius);padding:var(--space-4);box-shadow:var(--shadow-1)}
/* The vertical rhythm inside a card. A card is a plain block, so its children have
   no gap between them and nothing to collapse against: a `p` has had its UA margin
   stripped, a `.row`'s gap is horizontal, and a `.stack` opens flush against
   whatever is above it. Each of these four blocks therefore carries a step on the
   side where a sibling sits, and the first and last keep the card's own padding as
   their edge. The blocks that own their spacing instead - a `.view-toolbar`'s 16px,
   a `.dialog-actions`' 20px - are not in the list, so nothing is counted twice.
   The exception is a card whose own layout already owns the rhythm: a flex or grid
   card with a gap would add this margin to that gap and double the step. Each such
   card is named here, so a new variant that sets display and gap has to be added. */
.card:not(.inline-form,.provider-card,.metric-card,.project-card,.role-card,.settings-body,.parent-link-card)>:is(.row,.stack,.muted,p):not(:first-child){margin-top:var(--space-3)}
.card:not(.inline-form,.provider-card,.metric-card,.project-card,.role-card,.settings-body,.parent-link-card)>:is(.row,.stack,.muted,p):not(:last-child){margin-bottom:var(--space-3)}
/* The rule above reaches only direct children of a card, so a `.row` in a toolbar's
   filter bar or inside a list row is never matched - both containers own that space.
   Zeroed anyway, so the two stay excluded if that selector is ever widened: a step
   inside a filter bar pushes the toolbar out of alignment. */
.view-toolbar>.row,.list-row .row{margin-top:0;margin-bottom:0}
/* 20px between the sections of a page, whether or not the section is a card:
   one rhythm, so a page reads the same as the next one. */
.section{margin-top:var(--space-5)}
/* A section title and whatever counts or controls belong with it, on one line. */
.section-head{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-2)}
.section-head h2{margin:0}
.row{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:var(--space-3)}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3);margin-top:var(--space-3)}
.kv-grid{display:grid;grid-template-columns:140px 1fr;gap:var(--space-2) var(--space-3);padding-top:var(--space-1)}

/* ---- buttons ----
   A bare `button` is a reset, not a style. Until this existed every button in the
   app was filled with the accent, including the ones the sheet had not thought
   about, so a dismiss affordance arrived wearing the same paint as the page's
   primary action. A button that does something is a `.btn`; the rule here only
   removes the browser's chrome and hands the element the app's font. */
button{background:none;border:0;color:inherit;font:inherit;padding:0;cursor:pointer}
/* The default is the primary action: a `.btn` with no variant is the thing on the
   page a person is meant to press. `btn primary` says the same thing out loud, so
   both spellings are correct and neither has to be chased through the views. */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:var(--radius-sm);padding:var(--space-2) var(--space-4);font-weight:650;cursor:pointer;text-decoration:none;transition:filter var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.5;cursor:default}
/* Hover lifts the fill rather than dropping the button's opacity. At .9 the label
   faded with the box behind it, which reads as a control that has been disabled
   rather than one under the pointer. */
.btn:hover:not(:disabled){filter:brightness(1.16)}
/* Pressed: the button moves down a pixel and darkens, so a click has a reply even
   when the work it starts takes a second to land. */
.btn:active:not(:disabled){transform:translateY(1px);filter:brightness(.94)}
.btn.secondary{background:var(--surface-2);color:var(--text);border-color:var(--line)}
.btn.secondary:hover:not(:disabled){border-color:var(--line-strong)}
/* A ghost is a button that must not compete with the one beside it: a toolbar
   action, a dismiss. No fill at rest, so a row of them reads as chrome. */
.btn.ghost{background:transparent;color:var(--muted)}
.btn.ghost:hover:not(:disabled){background:var(--surface-2);color:var(--text);filter:none}
/* Destructive, and it says so with a border rather than reading as a dark smudge
   on the page. The tone is the warning; the border is what gives it an edge. */
.btn.danger{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-line)}
.btn.danger:hover:not(:disabled){border-color:var(--bad)}
/* Toolbar size, for a button that sits in a row of controls rather than alone. */
.btn.sm{padding:var(--space-1) var(--space-3);font-size:var(--text-sm);font-weight:600}
/* The phone's hamburger. Hidden at every width where the sidebar is part of the
   layout; the 1000px block below is where the sidebar leaves it and this arrives. */
.nav-toggle{display:none}
/* The backdrop is rendered only while the drawer is open, and the drawer only
   exists below 1000px - but a drawer left open when the window is widened to the
   desktop shell would drop this div into the grid as an unstyled item, taking a
   cell of its own and pushing the page into a second row. Out of layout at every
   width where it has no rules. */
.nav-backdrop{display:none}
/* The drawer takes focus when it opens, so a keyboard user lands inside the thing
   they opened. It is a container rather than a control, and a ring around the whole
   panel would read as a control that had been selected. */
.sidebar:focus{outline:none}
.chart-toggle{padding:var(--space-1) var(--space-3);font-size:var(--text-sm)}

.input{width:100%;background:var(--surface-0);color:var(--text);border:1px solid var(--line);padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);outline:none}
.input:focus{border-color:var(--accent-dim)}
/* One focus ring for the whole app, drawn only for keyboard navigation. Until this
   existed the only focus-visible rules in the file were on chart elements, so every
   button, tab and nav item was invisible to a keyboard user. */
button:focus-visible,.nav-item:focus-visible,.tab:focus-visible,a:focus-visible,.link-btn:focus-visible{outline:2px solid var(--accent-dim);outline-offset:2px;border-radius:var(--radius-sm)}
.tab:focus-visible{outline-offset:-2px}
.input:focus-visible{outline:2px solid var(--accent-dim);outline-offset:1px}
.field{display:grid;gap:var(--space-2)}
.field-label{font-size:var(--text-sm);color:var(--muted);font-weight:600}
/* An identifier shown inline - a UUID, a model id, a repository path - is set in
   the mono face, because it is read character by character rather than as a word,
   and one step smaller, so it does not outweigh the label it sits under. */
.mono-sm{font-family:var(--font-mono);font-size:var(--text-sm)}
.inline-form{display:grid;gap:var(--space-3);margin-bottom:var(--space-4)}
/* A textarea holds prose - a task's description, an idea, a note to a reviewer -
   so it takes the UI face. A field that really does hold code asks for `.mono`;
   forcing the mono face on every textarea made a paragraph of English look like
   a source file. */
textarea.input{font-family:var(--font-ui);resize:vertical}
textarea.input.mono{font-family:var(--font-mono);font-size:var(--text-sm)}

/* A badge is a state made visible: a tinted fill, a border in the same hue, and a
   dot that leads the word. The dot is `currentColor`, so a tone is declared once
   and the fill, the border, the text and the dot cannot drift apart. It is what
   makes a column of badges scannable - the colour reads before the label does. */
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px var(--space-2);font-size:var(--text-xs);font-weight:650;line-height:1.4;color:var(--muted);white-space:nowrap}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
.badge-good{color:var(--good);background:var(--good-bg);border-color:var(--good-line)}
.badge-warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.badge-bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-line)}
/* The one tone that waits on a person. Its own name rather than the accent: the
   accent is what the app offers to do, and this is what it is waiting for. */
.badge-info{color:var(--info);background:var(--info-bg);border-color:var(--info-line)}
/* Neutral carries no state - a count, an absent field - so it takes no tone and no
   dot. A grey light beside "3 commands" would read as a status that is off. */
.badge-neutral{color:var(--muted);background:transparent}
.badge-neutral::before{display:none}
/* Work in flight. The dot breathes, because the state is not a verdict - it is a
   placeholder for one that is coming - and a still amber dot beside a still
   green one reads as the same kind of fact. */
.badge-working::before{animation:pulse 1.6s var(--ease) infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.badge-working::before{animation:none}}

.list{display:flex;flex-direction:column;margin-top:var(--space-3);background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
/* A list is one surface with rules between its rows, not a stack of cards: a stack
   repeats the same border and radius once per row, and the page reads as a pile of
   boxes rather than as one thing with parts. A lone `.list-row` outside a list keeps
   the boxed form below. */
.list>.list-row{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:var(--space-3) var(--space-4)}
.list>.list-row:last-child{border-bottom:0}
.list>a.list-row:hover,.list>.list-row.clickable:hover{background:var(--surface-2);border-color:var(--line)}
.list>a.list-row:focus-visible{outline-offset:-2px}
.list>.list-row.attention{border-color:var(--line);background:linear-gradient(90deg,var(--info-bg),transparent 55%);box-shadow:inset 2px 0 0 var(--info)}
.card .list{background:var(--surface-0)}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:var(--space-4);background:var(--surface-1);border:1px solid var(--line);padding:var(--space-4);border-radius:var(--radius-sm)}
.list-row.clickable{cursor:pointer}
.list-row.clickable:hover{border-color:var(--accent-dim)}
/* A navigable row is an `<a>`, not a div with a click handler. A real link brings
   its own tab stop, Enter, middle-click and context menu, none of which a div
   gets for free - and the ones a div is usually given back are the ones most
   often forgotten. */
a.list-row{color:inherit;text-decoration:none}
a.list-row:hover{border-color:var(--accent-dim);background:var(--surface-2)}
a.list-row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* The rows that are waiting on a person rather than on a machine. A tinted edge
   and the same fill as a badge in the info tone: the section is already named
   "Needs your attention", and this makes the rows that answer to it findable
   from across the page. */
.list-row.attention{border-color:var(--info-line);background:linear-gradient(90deg,var(--info-bg),transparent 40%)}
.list-row-main a{color:inherit;text-decoration:none}
.list-row-main a:hover{text-decoration:underline}
.list-row-main{display:flex;flex-direction:column;gap:3px}
/* A path is an identifier, not prose: it is set in the mono face on a sunken
   chip, so it reads as a value that was copied rather than as a phrase that was
   written. */
.list-row code{background:var(--surface-sunken);border:1px solid var(--line);border-radius:4px;padding:1px var(--space-2)}
.list-row-side{display:flex;align-items:center;gap:var(--space-2)}

/* An empty screen is a place a person arrives at, not a dead end. One line says
   what is not here; one line says what to do about it. */
.empty-state{text-align:center;padding:var(--space-7) var(--space-5);color:var(--muted);display:grid;gap:var(--space-3);justify-items:center}
.empty-icon{width:32px;height:32px;color:var(--line-strong);margin-bottom:var(--space-1)}
.empty-title{color:var(--text);font-size:var(--text-lg);font-weight:650;margin:0}
.empty-hint{font-size:var(--text-sm);margin:0;max-width:44ch}

/* A timestamp is chrome, not content: it sits beside the thing it describes and
   must not pull the eye. Tabular figures keep a column of them from rippling. */
.time{font-variant-numeric:tabular-nums;white-space:nowrap}

.spinner-wrap{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-5) var(--space-1)}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .7s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- skeletons ---- */
/* First paint, before the data arrives. Each placeholder is the shape and the
   spacing of the row it stands in for, so nothing jumps when the real rows land. */
.skeleton{display:block;border-radius:var(--radius-sm);background:linear-gradient(90deg,var(--surface-2) 0%,var(--surface-3) 50%,var(--surface-2) 100%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
.skeleton-list{display:flex;flex-direction:column;gap:var(--space-2)}
.skeleton-row{display:flex;justify-content:space-between;align-items:center;gap:var(--space-4);background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius-sm);padding:var(--space-4)}
.skeleton-lines{display:flex;flex-direction:column;gap:var(--space-2);flex:1;min-width:0}
.skeleton-line{height:12px;max-width:320px}
.skeleton-line.short{width:38%}
.skeleton-badge{height:22px;width:84px;border-radius:999px;flex:0 0 auto}
.skeleton-value{height:28px;width:56%;margin-top:var(--space-1)}
.skeleton-table{display:flex;flex-direction:column;gap:var(--space-3)}
.skeleton-trow{display:flex;gap:var(--space-5)}
.skeleton-trow .skeleton-cell:first-child{flex:2}
.skeleton-cell{height:12px;flex:1}
@media(prefers-reduced-motion:reduce){.skeleton{animation:none}}

/* Centred in the header's empty middle rather than in a corner: the top right is
   where Search and New task are, and the bottom right is where the composers and
   the save bar are - a toast in either corner sat on the button a person was about
   to press. */
.toast-stack{position:fixed;top:var(--space-5);left:50%;transform:translateX(-50%);width:min(440px,calc(100vw - 32px));display:flex;flex-direction:column;align-items:stretch;gap:var(--space-2);z-index:1000;pointer-events:none}
.toast-stack>*{pointer-events:auto}
.toast{display:flex;align-items:flex-start;gap:var(--space-3);background:var(--surface-3);border:1px solid var(--line);border-radius:var(--radius-sm);padding:var(--space-3) var(--space-3) var(--space-3) var(--space-4);box-shadow:var(--shadow-2);font-size:var(--text-md);min-width:220px;max-width:360px;animation:toast-in .15s ease}
.toast-success{border-color:var(--good-line);color:var(--good)}
.toast-error{border-color:var(--bad-line);color:var(--bad)}
.toast-info{color:var(--text)}
.toast-text{flex:1;min-width:0;overflow-wrap:anywhere}
/* An error that covers the thing it is about is in the way, and a toast that
   outlives its usefulness is litter. It gets a way out that is not waiting. */
.toast-close{flex:0 0 auto;width:20px;height:20px;display:grid;place-items:center;border-radius:var(--radius-sm);color:inherit;opacity:.6;font-size:var(--text-sm);line-height:1}
.toast-close:hover{opacity:1;background:var(--wash)}
@keyframes toast-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.toast{animation:none}}

.code-block{white-space:pre-wrap;word-break:break-word;background:var(--surface-sunken);border:1px solid var(--line);border-radius:var(--radius);padding:var(--space-4);max-height:480px;overflow:auto;font-family:var(--font-mono);font-size:var(--text-sm)}
.error-text{color:var(--bad)}

/* ---- markdown ---- */
/* Prose rendered from a plan or a review. Every rule is scoped under .md because
   the base rules for h1/h2/h3 (:67-70) are sized for chrome, not for a document:
   h3 is uppercased, letter-spaced and muted, which would render a plan's "### Step"
   as shouting grey caps. Inheritance is not enough there, so h3 is restated. */
.md{word-break:break-word;background:var(--surface-sunken);border:1px solid var(--line);border-radius:var(--radius);padding:var(--space-4);max-height:480px;overflow:auto;font-size:var(--text-md);line-height:1.65}
.md h1,.md h2,.md h3{margin:var(--space-5) 0 var(--space-2);font-weight:650;color:var(--text)}
.md h1{font-size:var(--text-xl)}
.md h2{font-size:var(--text-lg)}
.md h3{font-size:var(--text-md);color:var(--text);text-transform:none;letter-spacing:normal}
/* The container's own padding supplies the outer gap, so leading and trailing
   margins would double it up at the top and bottom of the block. */
.md> :first-child{margin-top:0}
.md> :last-child{margin-bottom:0}
.md p{margin:0 0 var(--space-3)}
.md ul,.md ol{margin:0 0 var(--space-3);padding-left:var(--space-5)}
.md li{margin:2px 0}
.md li>ul,.md li>ol{margin-bottom:0}
/* Inline code sits on a lighter surface than the .md background, and a fenced
   block sits on the card surface so it stays legible as a distinct block rather
   than a hole in the prose. */
.md code{background:var(--surface-3);border:1px solid var(--line);border-radius:4px;padding:1px var(--space-1);font-family:var(--font-mono);font-size:var(--text-sm)}
.md pre{margin:0 0 var(--space-3);padding:var(--space-3);background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius-sm);overflow:auto;white-space:pre}
.md pre code{background:none;border:0;padding:0;font-size:var(--text-sm)}
.md blockquote{margin:0 0 var(--space-3);padding:0 0 0 var(--space-3);border-left:2px solid var(--accent-dim);color:var(--muted)}
.md table{width:100%;border-collapse:collapse;margin:0 0 var(--space-3)}
.md th,.md td{padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.md th{color:var(--muted);font-weight:600;font-size:var(--text-sm)}
.md hr{border:0;border-top:1px solid var(--line);margin:var(--space-4) 0}
/* Underlined at rest, unlike the app's own .link: a link inside a document is a
   link, and every one of these now opens a new tab, which a reader should see
   coming. Stated explicitly rather than left to the UA stylesheet. */
.md a{color:var(--accent);text-decoration:underline}
.md img{max-width:100%}

/* ---- metrics ---- */
/* auto-fit rather than a fixed count: a page has four of these cards and a task's
   stats tab has five, and four fixed columns orphan the fifth onto a row of its
   own. At 150px minimum the four-card pages keep exactly the tracks they had. */
/* The overview stacks a .section, then this grid, then another .section. The section
   brings its own top margin and the grid has none, so the grid needs the same step
   or it sits flush under the list above it. */
.section+.metric-grid{margin-top:var(--space-5)}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--space-3)}
/* min-width:0 stops the charts' measured SVG width from feeding back into the
   grid track and widening the column past the viewport. */
.metric-card{display:flex;flex-direction:column;gap:var(--space-2);min-width:0}
.metric-label{font-size:var(--text-sm);text-transform:uppercase;letter-spacing:.04em}
.metric-value{font-size:var(--text-2xl);font-weight:750}
.metric-note{font-size:var(--text-xs)}
/* The usage page's nine metric cards: auto-fit fills a desktop row with seven
   and orphans two beneath. Five fixed columns land them 5/4; the step-downs
   keep full final rows at every width. */
.metric-grid.usage-metrics{grid-template-columns:repeat(5,1fr)}
@media(max-width:1199px){
  .metric-grid.usage-metrics{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:650px){
  .metric-grid.usage-metrics{grid-template-columns:1fr 1fr}
  /* An odd card count would orphan the last card half-width; it spans instead. */
  .metric-grid.usage-metrics .metric-card:last-child:nth-child(odd){grid-column:1/-1}
}
@media(max-width:400px){
  /* Still two across: a figure and its label fit in half a phone, and one card per
     row turned four numbers into a screen and a half of scrolling. */
  .metric-grid.usage-metrics{grid-template-columns:1fr 1fr}
  .metric-card{padding:var(--space-3)}
}

/* ---- charts ---- */
.chart-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-3);margin-top:var(--space-6);align-items:start}
/* No margin of its own: a chart card is a .section first, and the page's 20px step
   from .section puts it under the row of figures above it. */
.chart-card{min-width:0;overflow:visible}
.chart-head{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);margin-bottom:var(--space-1)}
.chart-head h2{margin:0}
.chart-figure{position:relative;margin-top:var(--space-3);min-width:0}
/* Clamp the first paint (before the ResizeObserver reports) to the container,
   so a chart never pushes the page wide for a frame. */
.chart-figure svg{max-width:100%}
.chart-svg{display:block;outline:none}
.chart-svg:focus-visible{outline:2px solid var(--accent-dim);outline-offset:2px;border-radius:var(--radius-sm)}
.chart-hit{cursor:crosshair}
.chart-tick{fill:var(--muted);font-size:var(--text-xs);font-variant-numeric:tabular-nums}
.chart-cat{fill:var(--text);font-size:var(--text-sm)}
.chart-value{fill:var(--muted);font-size:var(--text-sm);font-variant-numeric:tabular-nums}
.chart-bar{transition:filter .12s}
.chart-bar-row:hover .chart-bar{filter:brightness(1.18)}
.chart-bar-row:focus-visible{outline:2px solid var(--accent-dim);outline-offset:2px}
.chart-nodata{margin:var(--space-4) 0}
.sparkline{margin-top:2px;min-height:34px}
.sparkline svg{display:block}
.chart-tip{position:absolute;top:0;transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--line);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);pointer-events:none;box-shadow:var(--shadow-2);white-space:nowrap;z-index:2}
.chart-tip-row{display:flex;align-items:center;gap:var(--space-2)}
.chart-tip-key{width:12px;height:2px;border-radius:1px;flex:0 0 auto}
.chart-tip-value{font-weight:700;font-size:var(--text-md);font-variant-numeric:tabular-nums}
.chart-tip-label{font-size:var(--text-xs);color:var(--muted);margin-top:1px}
/* Multi-series tooltip: one row per series, each value beside the swatch that
   identifies it. Capped so the box can never widen the page - chart cards have
   no scroll container of their own. */
.chart-tip-multi{max-width:min(240px,100%);white-space:normal}
.chart-tip-head{font-size:var(--text-xs);color:var(--muted);margin-bottom:var(--space-1)}
.chart-tip-multi .chart-tip-key{width:10px;height:10px;border-radius:2px}
.chart-tip-multi .chart-tip-value{font-size:var(--text-xs);font-weight:600;margin-left:auto}
.chart-tip-name{flex:1 1 auto;min-width:0;font-size:var(--text-xs);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Legend: the identity channel for a multi-series chart. The swatch carries the
   hue, the text stays in an ink token, and the series total rides along so the
   chart is readable without hovering. */
.legend{list-style:none;display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-4);margin:var(--space-3) 0 0;padding:0}
.legend-item{display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-sm);min-width:0}
.legend-key{width:10px;height:10px;border-radius:2px;flex:0 0 auto}
.legend-label{color:var(--text)}
.legend-value{color:var(--muted);font-variant-numeric:tabular-nums}
.chart-note{margin:var(--space-3) 0 0;font-size:var(--text-sm)}
.run-timeline-row{outline:none}
.run-timeline-row:hover .chart-bar,.run-timeline-row:focus-visible .chart-bar{filter:brightness(1.18)}
.run-timeline-row:focus-visible{outline:2px solid var(--accent-dim);outline-offset:2px}
/* The run in flight: dimmed under a slow pulse, so the bar with no end yet is
   readable as still moving rather than as a run that finished at the axis end. */
.run-timeline-bar--live{animation:run-timeline-pulse 2s ease-in-out infinite}
.run-timeline-fallback{opacity:.7}
@keyframes run-timeline-pulse{0%,100%{opacity:.6}50%{opacity:1}}

/* Refetching keeps the previous render in place at reduced opacity rather than
   flashing a skeleton and jumping the layout. */
.is-refetching .metric-grid,.is-refetching .chart-grid,.is-refetching .section{opacity:.55;transition:opacity .15s}

.table-scroll{overflow-x:auto;overscroll-behavior-x:contain}

/* ---- segmented control (period selector) ---- */
.seg{display:inline-flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:2px}
.seg-btn{background:transparent;color:var(--muted);padding:var(--space-2) var(--space-3);border-radius:4px;font-weight:600;font-size:var(--text-sm)}
.seg-btn:hover{color:var(--text)}
.seg-btn.active{background:var(--surface-3);color:var(--text)}

/* ---- keyboard shortcuts ---- */
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 var(--space-2);background:var(--surface-3);border:1px solid var(--line);border-bottom-width:2px;border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:var(--text-xs);font-weight:600;color:var(--text)}
.kbd-keys{display:inline-flex;gap:var(--space-1);flex:0 0 auto}
.kbd-hint{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--text-sm)}
.kbd-overlay{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding:80px var(--space-4) var(--space-6);overflow-y:auto;z-index:900}
.kbd-legend{width:100%;max-width:440px;box-shadow:var(--shadow-3)}
.kbd-legend-head{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3)}
.kbd-list{list-style:none;margin:0;padding:0;display:grid;gap:0}
.kbd-row{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-2) var(--space-1);border-bottom:1px solid var(--line)}
.kbd-row:last-child{border-bottom:0}
.kbd-row-label{font-size:var(--text-md)}

/* ---- confirm dialog ---- */
/* The same overlay as the palette, centred rather than top-aligned: a question
   that stops the page should land where the eye already is, and it is short
   enough that there is no list to scroll. */
.confirm-overlay{align-items:center;padding:var(--space-5)}
.dialog{width:100%;max-width:420px;padding:var(--space-5);box-shadow:var(--shadow-3)}
.dialog-title{margin:0 0 var(--space-2);font-size:var(--text-lg);font-weight:650;line-height:1.35}
.dialog-body{margin:0;color:var(--muted);font-size:var(--text-md);line-height:1.55}
.dialog-actions{display:flex;justify-content:flex-end;gap:var(--space-2);margin-top:var(--space-5)}
/* The form variant. Fields want more room than a two-line question does. */
.dialog-wide{max-width:560px}

/* ---- detail drawer ---- */
/* Detail belongs beside the list that produced it. A row that opens a panel over
   the table keeps the row and its context on screen, so reading one run does not
   cost the place in the list you were reading from. */
.drawer-scrim{position:fixed;inset:0;background:var(--scrim);z-index:800;animation:fade-in .12s ease}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);display:flex;flex-direction:column;background:var(--surface-1);border-left:1px solid var(--line);box-shadow:var(--shadow-3);z-index:801;animation:drawer-in .16s var(--ease)}
.drawer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3);padding:var(--space-4) var(--space-5);border-bottom:1px solid var(--line)}
.drawer-title{margin:0;font-size:var(--text-lg);font-weight:650;min-width:0;overflow-wrap:anywhere}
.drawer-body{padding:var(--space-5);overflow-y:auto;display:flex;flex-direction:column;gap:var(--space-4)}
@keyframes drawer-in{from{transform:translateX(16px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.drawer,.drawer-scrim{animation:none}}

/* ---- command palette (Cmd/Ctrl+K) ---- */
/* Same overlay chrome as the shortcut legend, with the list padded out of the card
   edge so the highlighted row has somewhere to sit. */
.cmd{width:100%;max-width:560px;padding:0;overflow:hidden;box-shadow:var(--shadow-3)}
.cmd-input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:var(--space-4);font-size:var(--text-lg);outline:none}
.cmd-list{list-style:none;margin:0;padding:var(--space-2);display:flex;flex-direction:column;gap:2px;max-height:min(60vh,420px);overflow-y:auto}
.cmd-group{font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:var(--space-2) var(--space-3) var(--space-1)}
.cmd-item{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);cursor:pointer}
.cmd-item.active{background:var(--surface-3)}
.cmd-item-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--text-md)}
/* The characters a fuzzy query matched. `mark`'s own yellow is not this theme. */
.cmd-hit{background:none;color:var(--accent);font-weight:700}
.cmd-item-hint{font-size:var(--text-xs);color:var(--muted);flex:0 0 auto}
.cmd-empty{padding:var(--space-5) var(--space-3);text-align:center}
.cmd-foot{display:flex;gap:var(--space-4);border-top:1px solid var(--line);padding:var(--space-2) var(--space-4);font-size:var(--text-xs);color:var(--muted)}

/* ---- task picker ----
   The palette's list classes, in a form field rather than in a dialog: an id is
   not something a person has in hand, so the parent is chosen by title. */
/* The results float over what is below the field rather than pushing it down: an
   open list that grew the dialog moved the buttons under the pointer while the
   person was still choosing. */
.task-picker{position:relative}
.task-picker .cmd-list{position:fixed;z-index:990;max-width:min(560px,calc(100vw - 32px));overflow-y:auto;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--surface-2);box-shadow:var(--shadow-2)}
/* The input and its clear affordance. This is the positioning context rather
   than the field, so the ✕ centres on the input and not on the label above it. */
.task-picker-wrap{position:relative}
.task-picker-wrap .input{padding-right:var(--space-6)}
.task-picker-clear{position:absolute;right:var(--space-2);top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);padding:var(--space-1);border-radius:var(--radius-sm);font-size:var(--text-md);line-height:1}
.task-picker-clear:hover{background:var(--surface-3);color:var(--text)}

/* ---- toolbar / tabs ---- */
.tasks-head{display:grid;gap:var(--space-3);margin-bottom:var(--space-4)}
/* The grid's column is a 1fr, and a grid item's automatic minimum size would floor
   it at its content's min-content width - which the wrapping row below and the
   scrolling tab strip then push past the viewport. Zero lets the column track the
   page, and both children wrap or scroll inside it instead. */
.tasks-head>*{min-width:0}
.tasks-actions{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.tasks-actions .search-input{flex:1 1 240px;width:auto;max-width:440px}
/* One height for the three controls in this row. A <select> sizes its own content
   box from the font's metrics rather than from the line-height it inherits, and a
   bare button has no border, so at one font size the three land 2px apart and the
   row reads as three misaligned controls. The term is the body's 1.5 line-height
   plus 8px of padding twice plus a 1px border twice; the coarse-pointer minimum
   below still wins, because min-height beats height. */
.tasks-actions .input,.tasks-actions .btn{height:calc(1.5em + var(--space-2) * 2 + 2px)}
.tasks-tabs{display:flex;align-items:center;gap:var(--space-3);border-bottom:1px solid var(--line)}
.tasks-tabs .tabs{border-bottom:0;flex:1;min-width:0}
.switch{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--text-sm);color:var(--muted);white-space:nowrap;cursor:pointer}
.switch:hover{color:var(--text)}
.field.inline{display:inline-flex;align-items:center;gap:var(--space-2)}
.field.inline .input{width:auto}
/* ---- select ----
   The trigger is an `.input`, so it takes the same height, border and focus ring as
   the fields beside it; the list is a raised surface in the palette's own colours. */
.select{position:relative;min-width:0}
.select-trigger{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);text-align:left;cursor:pointer;line-height:1.5}
.select-trigger:disabled{opacity:.55;cursor:default}
.select-trigger:hover:not(:disabled){border-color:var(--line-strong)}
.select.open .select-trigger{border-color:var(--accent-dim)}
.select-value{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.select-chevron{width:14px;height:14px;flex:none;fill:none;stroke:var(--muted);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--dur-fast) var(--ease)}
.select.open .select-chevron{transform:rotate(180deg)}
.field.inline .select-trigger{width:auto}
.select-list{position:fixed;z-index:990;min-width:100%;width:max-content;max-width:min(360px,90vw);max-height:280px;overflow-y:auto;margin:0;padding:var(--space-1);list-style:none;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--radius);box-shadow:var(--shadow-2);animation:select-in .12s var(--ease)}
@keyframes select-in{from{opacity:0;transform:translateY(-3px)}}
.select-option{display:flex;align-items:center;gap:var(--space-3);padding:7px var(--space-3);border-radius:var(--radius-sm);cursor:pointer;font-size:var(--text-md);color:var(--text)}
.select-option.active{background:var(--surface-3)}
.select-option[aria-disabled]{opacity:.45;cursor:default}
.select-option-label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.select-option-hint{color:var(--muted);font-size:var(--text-sm);flex:none}
.select-check{width:14px;height:14px;flex:none;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.select-sm .select-trigger{padding:3px var(--space-2) 3px var(--space-3);font-size:var(--text-sm)}
.select-sm .select-option{font-size:var(--text-sm);padding:6px var(--space-3)}
@media(prefers-reduced-motion:reduce){.select-list{animation:none}}
.inline-form-head,.inline-form-foot{display:flex;align-items:center;gap:var(--space-2)}
.inline-form-head :is(h2,h3){margin:0;margin-right:auto}
/* A dialog is centred by its overlay, so the inline form's bottom step would only
   push it off centre. */
.dialog.inline-form{margin-bottom:0}
/* The ✕ that closes the inline form. A glyph rather than a word, so it drops the
   accent a primary action carries and takes a square box of its own - which is also
   what keeps it off the 12px underlined .link-btn it would otherwise inherit. */
.icon-btn{background:transparent;color:var(--muted);border:0;padding:0;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:var(--text-lg);line-height:1;border-radius:var(--radius-sm)}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}
.inline-form-foot{justify-content:flex-end}
.inline-form-foot .muted{margin-right:auto;font-size:var(--text-sm)}
.inline-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
.view-toolbar{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);margin-bottom:var(--space-4);flex-wrap:wrap}
/* A toolbar holding a single action has nothing to sit opposite, and space-between
   would strand it against the left edge. Two toolbars hold a single child today:
   routing's Save, and the projects page's pair of creation buttons. */
.view-toolbar:has(> :only-child){justify-content:flex-end}
.view-lead{margin:0;color:var(--muted);font-size:var(--text-md);flex:1 1 280px;min-width:0}
/* ---- page head ----
   A detail page opens with its subject: the name large, the facts about it in one
   muted line, and the page's own action opposite. No card around it - the page is
   the card. */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap}
.page-head-main{display:grid;gap:6px;min-width:0;flex:1 1 320px}
.page-head-main h1{margin:0;font-size:var(--text-2xl);font-weight:650;letter-spacing:-.02em;line-height:1.2;overflow-wrap:anywhere}
.page-head-meta{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;font-size:var(--text-sm);color:var(--muted)}
.notice{padding:var(--space-3) var(--space-4);border:1px solid var(--info-line);background:var(--info-bg);border-radius:var(--radius);font-size:var(--text-md);color:var(--text)}
.clip{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.project-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:var(--space-4);align-items:start}
.project-side{position:sticky;top:var(--space-4)}
.project-side .list-row-main{min-width:0}
@media(max-width:1199px){.project-layout{grid-template-columns:minmax(0,1fr)}.project-side{position:static}}
/* ---- projects ---- */
.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--space-4)}
.project-card{display:grid;gap:var(--space-3);color:inherit;text-decoration:none;transition:border-color var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease)}
.project-card:hover{border-color:var(--line-strong);background:var(--surface-2);color:inherit}
.project-card-head{display:flex;align-items:center;gap:var(--space-2);min-width:0}
.project-card-name{flex:1;min-width:0;font-size:var(--text-lg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.project-card-path{font-family:var(--font-mono);font-size:var(--text-sm);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-6px}
.project-card-stats{display:flex;gap:var(--space-4);flex-wrap:wrap;font-size:var(--text-sm);color:var(--muted);padding:var(--space-3) 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.project-card-stats b{color:var(--text);font-size:var(--text-lg);font-weight:650;margin-right:2px}
.project-card-stats .warn,.project-card-stats .warn b{color:var(--warn)}
.warn-text{color:var(--warn)}
.project-card-foot{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;font-size:var(--text-sm)}
.project-card-foot>span:first-child{flex:1;min-width:0}
.project-form{max-width:760px}
.inline-form-head h3{text-transform:none;letter-spacing:normal;color:var(--text);font-size:var(--text-lg)}
/* A toolbar opens a section, and the ones that open a card - the first thing inside
   it - are already placed by the card's own padding. One that follows content is not:
   the head over the drafts list sat on the block above it, reading as a caption for
   that block rather than as the start of a new one. It takes the page's section step,
   which is deliberately more above the head than the 16px below it. */
.card>.view-toolbar:not(:first-child){margin-top:var(--space-5)}
/* The search field the `/` shortcut has always looked for. Fixed width so the
   toolbar does not reflow as the user types. */
.search-input{width:240px;max-width:100%}
/* The strip scrolls rather than wrapping or widening the page. Seven tabs do not fit a
   phone, and a tab that has been pushed off the right edge is a tab nobody finds. The
   bottom border stays on the container so the row still reads as a tab strip while it
   scrolls; the padding keeps the last tab's underline off the edge. */
.tabs{display:flex;gap:var(--space-1);border-bottom:1px solid var(--line);overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
/* Never shrunk. A flex item shrinks by default, and a tab squeezed below its content
   wraps its label away from its count - which is the wrapping the rule above exists to
   avoid. Holding its width is what makes the strip scroll. */
/* Sentence case, never shouted. The label is a word a person reads - "Plan",
   "Execute" - and upper-casing it in the sheet or in the view turns the tab strip
   into a row of abbreviations. `text-transform:none` is stated rather than
   inherited so a tab inside an uppercased ancestor stays readable. */
.tab{background:transparent;color:var(--muted);border-radius:0;padding:var(--space-2) var(--space-4);font-weight:600;font-size:var(--text-md);flex-shrink:0;text-transform:none;letter-spacing:normal}
.tab:hover{background:transparent;color:var(--text)}
.tab.active{color:var(--text);border-bottom:2px solid var(--accent)}
.tab-count{color:var(--muted);font-weight:500;font-size:var(--text-sm)}
.tab.active .tab-count{color:var(--accent)}
/* A revision that landed while the user was on another tab. Not .tab-count, which is
   for numbers: this is a flag, and there is only ever one of it. */
.tab-done{width:13px;height:13px;margin-left:4px;vertical-align:-2px;fill:none;stroke:var(--good);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:var(--space-2);vertical-align:middle}
.tab-content{margin-top:var(--space-4)}
/* The next step in the workflow, when it lives on another tab. A pill like
   .plan-notice, but it carries the page's primary action rather than an aside, so
   the button is a real .btn: on a page whose only other affordance is a tab click,
   this is the thing to press. */
/* Between the tab rule and the tab's own content, so it takes the same 16px on both
   sides - the step .tab-content already uses below it. */
.next-step-banner{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;font-size:var(--text-md);padding:var(--space-3) var(--space-4);border:1px solid var(--accent-dim);border-radius:var(--radius-sm);background:var(--surface-2);margin:var(--space-4) 0}
.next-step-banner .btn{padding:var(--space-2) var(--space-3);font-size:var(--text-sm)}

/* ---- task detail ---- */
/* A step above the scale's 6px rounding: the tabs sit directly under this, and at
   8px the title and the tab row read as one crowded block. */
/* The back link is a fixed-width affordance rather than a wrapping one: it is squeezed
   by a long title, and "Back / to / tasks" over three lines is three lines of a phone
   screen spent on the way out of the page. The title wraps instead, which is what a
   title is for. */
.task-header{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-4);margin-bottom:var(--space-3)}
.task-header>.link{white-space:nowrap;flex-shrink:0}
/* The task's state sits beside its name rather than in the meta line below it. The
   state is the first thing a person checks when they open a task, and it was
   third in a row of grey text. */
.task-title-row{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap}
.task-title-row h1{margin:0;min-width:0;font-size:var(--text-2xl);font-weight:650;letter-spacing:-.02em;line-height:1.2}
.task-meta .link-btn{text-decoration:none;font-weight:500}
.task-meta .link-btn:hover{text-decoration:underline}
.plan-toolbar{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap}
.plan-model{gap:var(--space-2)}
.seg-btn:disabled{opacity:.45;cursor:default}
.parent-link-card{margin-top:var(--space-3);max-width:560px;display:grid;gap:var(--space-3)}
.task-header-actions{display:flex;align-items:center;gap:var(--space-2);flex:0 0 auto}
.task-meta{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap;font-size:var(--text-sm);margin-top:var(--space-2)}
/* The task's id, shortened and copyable. It reads as a chip rather than as text a
   person is meant to read, because it is not - it is the handle for everything
   outside this page, and clicking it is how it gets there. */
.id-chip{display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:var(--text-xs);color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:1px var(--space-2);cursor:pointer}
.id-chip:hover{color:var(--text);border-color:var(--line-strong)}
.task-description{margin:var(--space-3) 0 0;color:var(--muted);font-size:var(--text-md);line-height:1.55;max-width:700px;white-space:pre-line}
/* The header's left column is a title, a meta line, then whichever of the description
   or the parent buttons the task has - not a .stack, so nothing spaces the last of
   them. On a task with no description the Link parent row sat on the meta line itself;
   the .stack step, which is what this row would have been given anywhere else. Scoped
   past the header's own .card so the editor inside it keeps its single 12px gap. */
.task-header>div>.row{margin-top:var(--space-3)}
.activity-box{position:relative;max-height:560px;overflow:auto;background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius);padding:var(--space-4)}
.activity-notice{position:sticky;top:calc(-1 * var(--space-4));z-index:2;margin:calc(-1 * var(--space-4)) calc(-1 * var(--space-4)) var(--space-3);padding:var(--space-2) var(--space-4);background:var(--surface-1);border-bottom:1px solid var(--line);font-size:var(--text-sm);color:var(--muted);display:flex;align-items:center;gap:var(--space-2)}
.link-btn{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-size:var(--text-sm);font-weight:600;text-decoration:underline;cursor:pointer}
.link-btn:hover{opacity:1;text-decoration:none}
.jump-btn{position:sticky;bottom:var(--space-3);margin:var(--space-3) auto 0;display:block}
/* The revision notice, and the same shape reused for the mid-edit one. Neutral rather
   than a warning tone: a revision landing is the thing that was asked for. */
.plan-notice{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;font-size:var(--text-md);padding:var(--space-2) var(--space-3);border:1px solid var(--accent-dim);border-radius:var(--radius-sm);background:var(--surface-2)}
.plan-live{margin-bottom:0}
.plan-action{margin-top:var(--space-2);font-size:var(--text-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- event stream ---- */
.event-stream{display:flex;flex-direction:column;gap:var(--space-2)}
.event-row{display:flex;align-items:baseline;gap:var(--space-3);border-left:2px solid var(--line);padding:var(--space-2) 0 var(--space-2) var(--space-3);font-size:var(--text-md)}
/* The kind column is a fixed width so the badges stack into a scannable column
   rather than each row starting at its own offset, and the clock is pushed to the
   right edge instead of riding the end of a variable-length message. */
.event-row .badge{min-width:76px;justify-content:center}
.event-row:hover{background:var(--wash)}
.event-msg{flex:1;word-break:break-word}
.event-time{font-size:var(--text-xs);white-space:nowrap;font-variant-numeric:tabular-nums;margin-left:auto;padding-left:var(--space-3)}
/* The left rule carries the kind, so a column of rows can be scanned without reading
   every badge. Quiet kinds - a tool's output, a reasoning trace, a notice - recede
   to the muted colour; they are context for the row above them, not news. */
.event-row.kind-said{border-left-color:var(--accent-dim)}
.event-row.kind-tool{border-left-color:var(--accent)}
.event-row.kind-done{border-left-color:var(--good)}
.event-row.kind-error{border-left-color:var(--bad)}
.event-row.kind-limit{border-left-color:var(--warn)}
.event-row.kind-out .event-msg,.event-row.kind-think .event-msg,.event-row.kind-note .event-msg{color:var(--muted)}
.event-row.kind-think .event-msg{font-style:italic}

/* Next steps in the port tab: a numbered list where each step may carry the command
   that performs it. The command is a block rather than inline, so it can be selected
   and copied whole instead of by drag. */
.steps{margin:0;padding-left:var(--space-5);display:grid;gap:var(--space-3);font-size:var(--text-md)}
.steps li{padding-left:2px}
.steps .code-block{margin:var(--space-2) 0 0}
/* The port verdict. The left rule carries the state's tone the way the activity feed's
   rules carry an event's kind, so the answer is legible before the words are read. */
.port-state{background:var(--surface-1);border:1px solid var(--line);border-left-width:3px;border-radius:var(--radius);padding:var(--space-4)}
.port-state.good{border-left-color:var(--good)}
.port-state.warn{border-left-color:var(--warn)}
.port-state.bad{border-left-color:var(--bad)}
.port-state.neutral{border-left-color:var(--accent-dim)}
.port-head{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;margin-bottom:var(--space-2)}
.port-head h2{margin:0;font-size:var(--text-lg);color:var(--text)}
.port-state p{margin:0}
.port-result{margin-top:var(--space-3);color:var(--good);font-size:var(--text-md)}
/* The commits to be able to name. Referenceable rather than described: a hash is what
   you paste into git, and the subject is what makes it recognisable in a log. */
.refs{margin-top:var(--space-3);display:grid;gap:var(--space-2)}
.ref{display:flex;align-items:baseline;gap:var(--space-2);flex-wrap:wrap;font-size:var(--text-sm)}
.ref-sha{font-family:var(--font-mono);font-size:var(--text-sm);background:var(--surface-3);border:1px solid var(--line);border-radius:var(--radius-sm);padding:1px var(--space-2);color:var(--accent)}
.ref-subject{color:var(--text)}
/* ---- diff viewer ----
   One box per file (web/components/diff-viewer.mjs). The border and the gap between
   boxes are the file boundary; the header inside each box stays pinned while its
   file scrolls past, so the reader always knows which file a line belongs to.
   The three tone classes below are also read by the session transcript's diff. */
.diff-add{background:var(--good-bg);color:var(--good)}
.diff-del{background:var(--bad-bg);color:var(--bad)}
.diff-hunk{color:var(--accent);background:var(--info-bg)}
.dv{display:grid;gap:var(--space-3);min-width:0}
.dv-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap}
.dv-sum{display:flex;align-items:baseline;gap:var(--space-2);flex-wrap:wrap;font-size:var(--text-sm)}
.dv-add{color:var(--good);font-family:var(--font-mono);font-size:var(--text-sm)}
.dv-del{color:var(--bad);font-family:var(--font-mono);font-size:var(--text-sm)}
.dv-ctrl{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}
.dv-ctrl .btn{padding:var(--space-1) var(--space-3);font-size:var(--text-xs);font-weight:600}
.dv-seg{display:inline-flex}
.dv-seg .btn:first-child{border-radius:var(--radius-sm) 0 0 var(--radius-sm)}
.dv-seg .btn:last-child{border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin-left:-1px}
.dv-seg .btn.on{color:var(--accent);border-color:var(--accent-dim);position:relative}
.dv-extra{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);font-family:var(--font-mono);font-size:var(--text-sm);background:var(--surface-sunken);border:1px solid var(--line);border-radius:var(--radius);padding:var(--space-3)}
/* The file list is the table of contents, sticky so any file is one click away. */
.dv-body{display:grid;gap:var(--space-4);align-items:start;min-width:0}
.dv-body.with-nav{grid-template-columns:240px minmax(0,1fr)}
.dv-nav{position:sticky;top:var(--space-4);display:grid;gap:2px;background:var(--surface-0);border:1px solid var(--line);border-radius:var(--radius);padding:var(--space-2);max-height:calc(100vh - 2 * var(--space-4));overflow-y:auto}
.dv-nav-item{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:var(--space-2);align-items:center;padding:6px var(--space-2);border:0;border-radius:var(--radius-sm);background:none;text-align:left;cursor:pointer;width:100%}
.dv-nav-item:hover{background:var(--surface-2)}
.dv-nav-item:focus-visible{outline:2px solid var(--accent-dim);outline-offset:-2px}
.dv-nav-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-mono);font-size:var(--text-xs)}
.dv-nav-item.viewed .dv-nav-name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.dv-nav-count{font-family:var(--font-mono);white-space:nowrap}
.dv-nav-count span{font-size:var(--text-xs)}
/* What happened to the file, as a letter in that outcome's tone. */
.dv-st{display:inline-grid;place-items:center;width:16px;height:16px;flex:0 0 auto;border:1px solid;border-radius:4px;font:700 10px/1 var(--font-mono)}
.dv-st-M{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.dv-st-A{color:var(--good);background:var(--good-bg);border-color:var(--good-line)}
.dv-st-D{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-line)}
.dv-st-R{color:var(--info);background:var(--info-bg);border-color:var(--info-line)}
.dv-st-U{color:var(--good);border-color:var(--good-line);border-style:dashed}
.dv-files{display:grid;gap:var(--space-4);min-width:0}
.dv-files>*{min-width:0}
.dv-file{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-sunken);scroll-margin-top:var(--space-4)}
.dv-file.viewed{border-color:var(--surface-3)}
.dv-fh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:var(--space-2);min-height:40px;padding:var(--space-2) var(--space-3);background:var(--surface-2);border-bottom:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0}
.dv-file.folded .dv-fh{border-bottom-color:transparent;border-radius:var(--radius)}
.dv-chev,.dv-icon{display:grid;place-items:center;flex:0 0 auto;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:4px}
.dv-chev{width:20px;height:20px;transition:transform var(--dur-fast) var(--ease)}
.dv-icon{padding:2px}
.dv-chev:hover,.dv-icon:hover{background:var(--surface-3);color:var(--text)}
.dv-file.folded .dv-chev{transform:rotate(-90deg)}
/* rtl so a path too long for the header loses its start, not its filename. */
.dv-path{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left;font-family:var(--font-mono);font-size:var(--text-sm)}
.dv-path bdi{direction:ltr}
.dv-path b{font-weight:600;color:var(--text)}
.dv-from{color:var(--muted);text-decoration:line-through}
.dv-meta{margin-left:auto;display:flex;align-items:center;gap:var(--space-3);flex:0 0 auto}
.dv-sim{font-size:var(--text-xs)}
.dv-bar{display:inline-flex;gap:1px}
.dv-bar i{width:7px;height:7px;border-radius:1.5px}
.dv-bar i.a{background:var(--good)}
.dv-bar i.d{background:var(--bad)}
.dv-viewed{display:inline-flex;align-items:center;gap:6px;padding:2px var(--space-2);border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-1);color:var(--muted);font-size:var(--text-xs);cursor:pointer;user-select:none}
.dv-viewed input{margin:0;accent-color:var(--accent)}
.dv-file.viewed .dv-viewed{color:var(--accent);border-color:var(--accent-dim)}
.dv-code{overflow-x:auto;border-radius:0 0 var(--radius) var(--radius);font-family:var(--font-mono);font-size:var(--text-sm)}
/* A long line wraps rather than scrolling the file sideways. `pre-wrap` keeps the
   indentation; `anywhere` covers an unbroken run - a minified bundle, a long path. */
.dv-txt{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0;padding:1px var(--space-3) 1px 0}
.dv-row{display:grid;grid-template-columns:44px 44px 16px minmax(0,1fr)}
.dv-ln{padding:1px var(--space-2) 1px 0;text-align:right;color:var(--muted);opacity:.7;user-select:none}
.dv-sign{padding:1px 0;text-align:center;user-select:none}
.dv-row.add{background:var(--good-bg);color:var(--good);box-shadow:inset 3px 0 0 var(--good)}
.dv-row.del{background:var(--bad-bg);color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
/* The hunk header is where the file is cut, so it reads as a seam. */
.dv-hunk{display:flex;align-items:center;gap:var(--space-2);padding:4px var(--space-3);background:var(--info-bg);color:var(--info);font-size:var(--text-xs);border-block:1px solid var(--line)}
.dv-hunk:first-child{border-top:0}
.dv-fn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.dv-range{margin-left:auto;white-space:nowrap;color:var(--muted);opacity:.8}
.dv-note{display:flex;gap:var(--space-2);padding:var(--space-3);color:var(--muted);font:var(--text-sm)/1.5 var(--font-ui)}
.dv-large{display:block;width:100%;padding:var(--space-3);border:0;background:var(--wash);color:var(--accent);font:var(--text-sm)/1.5 var(--font-ui);text-align:left;cursor:pointer}
.dv-large:hover{background:var(--surface-2)}
/* Split: each side is a number and a text column. */
.dv-srow{display:grid;grid-template-columns:44px minmax(0,1fr) 44px minmax(0,1fr)}
.dv-srow .dv-txt{padding-left:var(--space-2)}
.dv-srow .dv-txt.add{background:var(--good-bg);color:var(--good)}
.dv-srow .dv-txt.del{background:var(--bad-bg);color:var(--bad)}
.dv-srow .blank{background:var(--wash)}
.dv-srow .dv-ln.r{border-left:1px solid var(--line)}
/* Highlighted: the tint and the sign say added or deleted, and the text is the code's
   own colour rather than all green or all red. */
.dv-code.hl .dv-row.add .dv-txt,.dv-code.hl .dv-row.del .dv-txt,.dv-code.hl .dv-srow .dv-txt{color:var(--text)}
.dv-code.hl .dv-row.ctx .dv-txt{color:#c9d1dc}
.dv-code .hljs-keyword,.dv-code .hljs-selector-tag,.dv-code .hljs-literal,.dv-code .hljs-doctag{color:var(--syn-keyword)}
.dv-code .hljs-title,.dv-code .hljs-title.function_,.dv-code .hljs-section{color:var(--syn-function)}
.dv-code .hljs-string,.dv-code .hljs-template-tag,.dv-code .hljs-regexp,.dv-code .hljs-symbol{color:var(--syn-string)}
.dv-code .hljs-number,.dv-code .hljs-bullet{color:var(--syn-number)}
.dv-code .hljs-type,.dv-code .hljs-built_in,.dv-code .hljs-title.class_,.dv-code .hljs-variable.language_{color:var(--syn-type)}
.dv-code .hljs-attr,.dv-code .hljs-attribute,.dv-code .hljs-property,.dv-code .hljs-params,.dv-code .hljs-selector-class,.dv-code .hljs-selector-id{color:var(--syn-attr)}
.dv-code .hljs-name,.dv-code .hljs-tag,.dv-code .hljs-deletion{color:var(--syn-tag)}
.dv-code .hljs-comment,.dv-code .hljs-quote,.dv-code .hljs-meta{color:var(--syn-comment);font-style:italic}
.dv-code .hljs-meta .hljs-keyword,.dv-code .hljs-meta .hljs-string{font-style:normal}
.dv-code .hljs-emphasis{font-style:italic}
.dv-code .hljs-strong{font-weight:700}
.dv-wide{display:inline-flex;align-items:center;gap:6px}
.dv-wide[aria-pressed="true"]{color:var(--accent);border-color:var(--accent-dim)}
@media(max-width:900px){
  .dv-body.with-nav{grid-template-columns:minmax(0,1fr)}
  .dv-nav{position:static;max-height:none}
  .dv-row{grid-template-columns:36px 36px 14px minmax(0,1fr)}
  .dv-bar,.dv-sim,.dv-fh .dv-icon{display:none}
}

/* ---- terminal ----
   The host is what xterm's fit addon measures: it reads that element's computed height
   and width as the space the terminal has, and subtracts only the padding of the element
   xterm itself inserts. Under `*{box-sizing:border-box}` the computed height is the
   border box, so padding added to the host is space the terminal is sized against and
   then draws past - the last row is clipped. The inset between the border and the
   terminal is the box's padding for that reason, and the box is never measured. */
.terminal-frame{display:flex;flex-direction:column;gap:var(--space-2)}
.terminal-bar{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;font-size:var(--text-sm);color:var(--muted);min-height:20px}
.terminal-bar code{color:var(--text)}
.terminal-box{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;padding:var(--space-2)}
.terminal-host{height:clamp(320px,56vh,640px)}
/* A shell that outlived its socket: the server went away, or the network did. Said in
   the bar rather than written into the terminal, which is replaying what the shell
   printed before it went quiet - a line typed into that would read as the shell's. */
.terminal-state.warn{color:var(--warn)}
/* The working directory line above the box. A paragraph carries the browser's default
   ~16px top and bottom margin, and a grid item's margin is never collapsed into the
   track gap - so without this the .stack gap below the path is that gap plus the
   margin. Dropping it leaves the one intentional gap, the same 12px used elsewhere. */
.terminal-cwd{margin:0}
/* The worktree terminal while an agent run is writing the same directory. A warning
   and not a lock: watching a run is a reason to be in here, and a read-only `git log`
   mid-run is harmless. */
.terminal-warn{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;font-size:var(--text-md);padding:var(--space-2) var(--space-3);border:1px solid var(--warn-line);border-radius:var(--radius-sm);background:var(--warn-bg);color:var(--warn)}

/* ---- providers ---- */
.provider-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-4)}
.provider-card{display:grid;gap:var(--space-3)}
.provider-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-3)}
/* Circuit-breaker dot. The state is in the title attribute, so the card head
   stays one line and needs no extra column. */
.health{display:inline-block;flex:0 0 auto;width:8px;height:8px;border-radius:50%}
.health.good{background:var(--good)}
.health.warn{background:var(--warn)}
.health.bad{background:var(--bad)}
.provider-card{gap:var(--space-4)}
.provider-card.off .provider-card-title h2{color:var(--muted)}
.provider-card-head{align-items:center}
.provider-card-title{flex:1;min-width:0;display:grid;gap:4px}
.provider-card-title h2{margin:0;font-size:var(--text-lg)}
.provider-card-meta{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;font-size:var(--text-sm);color:var(--muted)}
.provider-health{display:inline-flex;align-items:center;gap:6px}
.provider-health.good{color:var(--good)}.provider-health.warn{color:var(--warn)}.provider-health.bad{color:var(--bad)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-sm)}
.model-table{width:100%;border-collapse:collapse;font-size:var(--text-md)}
.model-table th{text-align:left;font-size:var(--text-xs);font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:var(--space-2) var(--space-3);background:var(--surface-0);border-bottom:1px solid var(--line);white-space:nowrap}
.model-table td{padding:var(--space-3);border-bottom:1px solid var(--line);vertical-align:middle}
.model-table tr:last-child td{border-bottom:0}
.model-table tr.off td{color:var(--muted)}
.model-table .num{text-align:right;width:1%}
.model-name{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:var(--text-xs);padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
/* ---- filter bar ----
   A list page's controls on one line: the search takes the slack, the filters keep
   their own width, and what the filters leave is counted at the end. */
.filter-bar{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;margin-bottom:var(--space-4)}
.filter-bar .search-input{flex:1 1 260px;width:auto;max-width:420px}
.filter-bar .select-field{flex:none}
.filter-bar .select-trigger,.filter-bar .search-input{height:calc(1.5em + var(--space-2) * 2 + 2px)}
.filter-summary{margin-left:auto;font-size:var(--text-sm);color:var(--muted);white-space:nowrap}
.filter-summary b{color:var(--text);font-weight:600}
.filter-summary b.bad{color:var(--bad)}
.cell-pair{display:inline-flex;flex-direction:column;gap:2px}
.cell-pair>span{white-space:nowrap}
.model-table td:first-child{min-width:150px}
.model-table td:nth-child(3){white-space:nowrap}
/* ---- settings ----
   Each section says what it is for on the left and holds its controls on the right,
   so a page of unrelated settings reads as a set of labelled groups rather than a
   column of cards that all look alike. */
.view-settings{display:grid;gap:var(--space-6);max-width:1100px}
.settings-section{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:var(--space-6);align-items:start}
.settings-section+.settings-section{padding-top:var(--space-6);border-top:1px solid var(--line)}
.settings-about h2{margin:0 0 var(--space-1);font-size:var(--text-lg)}
.settings-about p{margin:0;color:var(--muted);font-size:var(--text-sm);line-height:1.55}
.settings-body{display:grid;gap:var(--space-4)}
.settings-body>.list{margin-top:0}
.settings-status{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-2) var(--space-5);margin:0;font-size:var(--text-md)}
.facts dt{color:var(--muted)}
.facts dd{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notice-warn{border-color:var(--warn-line);background:var(--warn-bg)}
.danger-zone{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap;padding:var(--space-4);border:1px solid var(--bad-line);border-radius:var(--radius-sm)}
.danger-zone>div:first-child{flex:1 1 260px;min-width:0}
.danger-zone p{margin:4px 0 0;font-size:var(--text-sm)}
.btn.danger-outline{background:transparent;color:var(--bad);border-color:var(--bad-line)}
