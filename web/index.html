<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Code — Mission Control</title><style>
:root{--bg:#0a0c10;--panel:#11151b;--panel2:#171c23;--line:#29313c;--text:#edf2f7;--muted:#8e9aaa;--accent:#9fb9ff;--good:#6fe0a1;--warn:#ffd37a;--bad:#ff8585}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{background:#e9eef5;color:#0b0d10;border:0;border-radius:8px;padding:9px 13px;font-weight:650;cursor:pointer}button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}button.danger{background:#351b1b;color:#ffb5b5}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:22px 14px;background:#0e1115}.logo{font-weight:800;font-size:17px;padding:0 10px 24px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:var(--muted);margin:2px 0}.nav button.active,.nav button:hover{background:var(--panel2);color:var(--text)}main{padding:28px 34px;max-width:1550px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:26px}.top h1{margin:0;font-size:24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px}.metric{font-size:26px;font-weight:750;margin-top:7px}.muted{color:var(--muted)}.section{margin-top:28px}.section h2{font-size:15px;margin:0 0 10px}.task{display:grid;grid-template-columns:1fr auto;gap:15px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:16px;border-radius:10px;margin:8px 0}.pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--muted);font-size:12px}.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}pre{white-space:pre-wrap;background:#090b0e;border:1px solid var(--line);border-radius:10px;padding:14px;max-height:420px;overflow:auto}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.stack{display:grid;gap:10px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;background:#0b0e12;color:var(--text);border:1px solid var(--line);padding:10px;border-radius:8px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{color:var(--muted);font-weight:600}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0}.tabs button{background:transparent;color:var(--muted);border-radius:0}.tabs button.active{color:var(--text);border-bottom:2px solid var(--accent)}.modal{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:25px;z-index:5}.modal>div{width:min(1050px,96vw);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}.kv{display:grid;grid-template-columns:170px 1fr;gap:7px;padding:6px 0}.event{border-left:2px solid var(--line);padding:7px 10px;margin:6px 0}.event b{color:var(--accent)}.success{color:var(--good)}.warning{color:var(--warn)}.error{color:var(--bad)}.hidden{display:none}@media(max-width:1000px){.app{grid-template-columns:1fr}.side{display:none}.grid,.grid3{grid-template-columns:1fr 1fr}main{padding:20px}}@media(max-width:650px){.grid,.grid3{grid-template-columns:1fr}.task{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="logo">AI CODE<br><span class="muted">Mission Control</span></div><div class="nav"><button data-view="overview" class="active">Overview</button><button data-view="projects">Projects</button><button data-view="tasks">Tasks</button><button data-view="providers">Providers</button><button data-view="routing">Routing</button><button data-view="runs">Runs</button><button data-view="usage">Usage</button><button data-view="settings">Settings</button></div></aside><main><div id="app"></div></main></div><div id="modal"></div><script>
const $=s=>document.querySelector(s),state={view:'overview',data:null,taskTab:'plan',taskId:null,taskEvents:[],stream:null};async function api(p,o={}){const r=await fetch(p,o);const x=await r.json();if(!r.ok)throw Error(x.error||'Request failed');return x}async function load(){state.data=await api('/api/overview');render()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function btn(label,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${label}</button>`}function shell(title,action=''){return `<div class="top"><h1>${title}</h1><div class="row">${action}</div></div>`}function status(s){const c=s==='COMPLETE'||s==='succeeded'||s==='ok'?'good':s==='FAILED'||s==='failed'?'bad':s==='AWAITING_APPROVAL'||s==='REPAIRING'?'warn':'';return `<span class="pill ${c}">${esc(s)}</span>`}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));const d=state.data||{};const views={overview,projects,tasks,providers,routing,runs,usage,settings};$('#app').innerHTML=views[state.view](d)}
function overview(d){return shell('Overview',btn('+ New task','newTask()'))+`<div class="grid"><div class="card"><span class="muted">Projects</span><div class="metric">${d.projects.length}</div></div><div class="card"><span class="muted">Active tasks</span><div class="metric">${d.tasks.filter(x=>!['COMPLETE','FAILED'].includes(x.state)).length}</div></div><div class="card"><span class="muted">Runs</span><div class="metric">${d.runs.length}</div></div><div class="card"><span class="muted">Providers</span><div class="metric">${d.providers.filter(x=>x.enabled).length}</div></div></div><div class="section"><h2>Active work</h2>${d.tasks.slice(0,10).map(taskCard).join('')||'<div class="card muted">No tasks yet.</div>'}</div><div class="section"><h2>Provider health</h2>${d.providers.map(providerMini).join('')}</div>`}
function taskCard(t){return `<div class="task"><div><b>${esc(t.title)}</b><div class="muted">${t.id.slice(0,8)} · ${esc(t.project_id)}</div></div><div class="row">${status(t.state)} ${btn('Open',`showTask('${t.id}')`,'secondary')}</div></div>`}
function providerMini(p){const routable=p.config?.routable!==false&&p.kind!=='mock';return `<div class="task"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.kind)} · ${routable?'Routable':'Test only / disabled for routing'}</div></div>${status(p.enabled?'Enabled':'Disabled')}</div>`}
function projects(d){return shell('Projects',btn('+ Project','newProject()'))+`<div class="section">${d.projects.map(p=>`<div class="task"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.path)} · ${esc(p.language||'')} · ${esc(p.framework||'')}</div></div><span class="pill">${Object.keys(p.commands||{}).length} commands</span></div>`).join('')||'<div class="card muted">No projects registered.</div>'}</div>`}
function tasks(d){return shell('Tasks',btn('+ New task','newTask()'))+`<div class="section">${d.tasks.map(taskCard).join('')||'<div class="card muted">No tasks yet.</div>'}</div>`}
function providers(d){return shell('Providers',btn('+ Provider','addProvider()'))+`<div class="grid3">${d.providers.map(p=>{const models=d.models.filter(m=>m.provider_id===p.id);return `<div class="card"><div class="top"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.kind)}</div></div>${status(p.enabled?'Enabled':'Disabled')}</div><div class="row"><span class="pill">${p.config?.routable===false||p.kind==='mock'?'Not routable':'Routable'}</span><span class="pill">${p.config?.billingMode||'unknown billing'}</span></div><div class="section"><h2>Models</h2>${models.map(modelRow).join('')||'<div class="muted">No models.</div>'}</div><div class="row">${btn('Configure',`configureProvider('${p.id}')`,'secondary')} ${btn('Test connection',`testProvider('${p.id}')`,'secondary')}${p.kind!=='mock'?` ${btn(p.enabled?'Disable':'Enable',`toggleProvider('${p.id}',${!p.enabled})`,'secondary')}`:''}</div></div>`}).join('')}</div>`}
function modelRow(m){return `<div class="card" style="padding:11px;margin:8px 0"><div class="row" style="justify-content:space-between"><div><b>${esc(m.displayName||m.name)}</b><div class="muted">AI Code ID: <code>${esc(m.id)}</code></div><div class="muted">Provider model: <code>${esc(m.providerModelId||m.name)}</code> · Claude Code invocation: <code>${esc(m.invocationModelId||m.name)}</code></div></div>${status(m.enabled?'Enabled':'Disabled')}</div><div class="muted">${m.capabilities.join(' · ')}</div><div class="muted" style="margin-top:6px">${m.billing_mode||'unknown'} · ${m.input_cost_per_mtok!=null?'$'+m.input_cost_per_mtok+'/M input · $'+m.output_cost_per_mtok+'/M output':'no published price'}${m.pricing_source?' · '+esc(m.pricing_source):''}</div></div>`}
function routing(d){const roles=['planner','implementer','reviewer','repair'];return shell('Routing',btn('Save routing','saveRouting()'))+`<div class="section stack">${roles.map(role=>routingCard(role,d)).join('')}</div>`}
function routingCard(role,d){const p=d.routing[role]||{};const cap=role==='planner'?'planning':role==='implementer'?'coding':role==='reviewer'?'review':'repair';const models=d.models.filter(m=>m.enabled&&m.provider_id!=='mock'&&m.capabilities.includes(cap));const pref=p.preferred?.[0]||'';const fall=p.fallback||[];const options=models.map(m=>`<option value="${esc(m.id)}" ${pref===m.id?'selected':''}>${esc(m.displayName||m.name)} — ${esc(m.provider_id)}</option>`).join('');const optionFor=(value)=>`<option value="">None</option>${models.map(m=>`<option value="${esc(m.id)}" ${value===m.id?'selected':''}>${esc(m.displayName||m.name)} — ${esc(m.provider_id)}</option>`).join('')}`;return `<div class="card"><div class="top"><div><b>${role[0].toUpperCase()+role.slice(1)}</b><div class="muted">${esc(p.strategy||'balanced')} routing</div></div><select id="strategy-${role}"><option value="quality" ${p.strategy==='quality'?'selected':''}>Quality</option><option value="balanced" ${p.strategy==='balanced'?'selected':''}>Balanced</option><option value="speed" ${p.strategy==='speed'?'selected':''}>Speed</option><option value="cost" ${p.strategy==='cost'?'selected':''}>Cost</option></select></div><div class="grid3"><div class="field"><label>Preferred model</label><select id="preferred-${role}"><option value="">Automatic</option>${options}</select></div><div class="field"><label>Fallback 1</label><select id="fallback1-${role}">${optionFor(fall[0]||'')}</select><label>Fallback 2</label><select id="fallback2-${role}">${optionFor(fall[1]||'')}</select></div><div class="field"><label>Effort</label><select id="effort-${role}">${['low','medium','high','xhigh','max'].map(x=>`<option value="${x}" ${p.effort===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="muted" style="margin-top:9px">Models are selected from the provider registry. AI Code resolves each selection to the provider's valid invocation model ID.</div></div>`}
function runs(d){return shell('Runs')+`<div class="card"><table class="table"><thead><tr><th>Role</th><th>Provider / Model</th><th>Status</th><th>Tokens</th><th>Cost</th><th>Duration</th></tr></thead><tbody>${d.runs.map(r=>`<tr><td>${esc(r.role)}</td><td>${esc(r.provider_id)}<br><span class="muted">${esc(r.model_id)}</span></td><td>${status(r.status)}</td><td>${Number(r.tokens||0).toLocaleString()}</td><td>$${Number(r.cost||0).toFixed(6)}<br><span class="muted">${esc(r.cost_basis||'')}</span></td><td>${r.duration_ms?Math.round(r.duration_ms/1000)+'s':'—'}</td></tr>`).join('')}</tbody></table></div>`}
function usage(d){const cost=d.runs.reduce((a,x)=>a+Number(x.cost||0),0),tokens=d.runs.reduce((a,x)=>a+Number(x.tokens||0),0);const by={};d.runs.forEach(r=>{by[r.provider_id]??={tokens:0,cost:0,runs:0};by[r.provider_id].tokens+=Number(r.tokens||0);by[r.provider_id].cost+=Number(r.cost||0);by[r.provider_id].runs++});return shell('Usage')+`<div class="grid"><div class="card"><span class="muted">Recorded cost</span><div class="metric">$${cost.toFixed(4)}</div></div><div class="card"><span class="muted">Recorded tokens</span><div class="metric">${tokens.toLocaleString()}</div></div><div class="card"><span class="muted">Completed</span><div class="metric">${d.runs.filter(x=>x.status==='succeeded').length}</div></div><div class="card"><span class="muted">Fallbacks</span><div class="metric">${d.runs.filter(x=>x.fallback_from).length}</div></div></div><div class="section card"><h2>By provider</h2><table class="table"><tr><th>Provider</th><th>Runs</th><th>Tokens</th><th>Cost</th></tr>${Object.entries(by).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.runs}</td><td>${v.tokens.toLocaleString()}</td><td>$${v.cost.toFixed(6)}</td></tr>`).join('')}</table></div>`}
function settings(d){return shell('Settings',btn('Run Doctor','doctor()'))+`<div class="grid3"><div class="card"><h2>Runtime</h2><p class="muted">AI Code owns workflow state in .ai-code. Provider credentials remain outside SQLite.</p><div class="field"><label>Dashboard refresh</label><select id="refresh"><option>2000</option><option selected>5000</option><option>10000</option></select></div></div><div class="card"><h2>Safety</h2><p class="muted">Planning is guarded by Claude Code plan mode plus Git dirty-state detection. Execution requires explicit approval and an isolated worktree.</p></div><div class="card"><h2>Diagnostics</h2><pre id="doctor">Run Doctor to inspect environment and credentials.</pre></div></div><div class="section card"><h2>Automation</h2><p class="muted">Webhook-ready automation definitions are persisted here. They do not claim to be a scheduler.</p>${(d.automations||[]).map(a=>`<div class="task"><div><b>${esc(a.name)}</b><div class="muted">${esc(a.trigger)} → ${esc(a.action)}</div></div>${status(a.enabled?'Enabled':'Disabled')}</div>`).join('')||'<div class="muted">No automation definitions.</div>'}</div>`}
async function newProject(){const name=prompt('Project name');if(!name)return;const p=prompt('Absolute project path');if(!p)return;await api('/api/projects',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,path:p})});await load()}
async function newTask(){if(!state.data.projects.length)return alert('Add a project first.');const p=prompt('Project ID:\n'+state.data.projects.map(x=>x.id+' — '+x.name).join('\n'));if(!p)return;const title=prompt('Task');if(!title)return;const t=await api('/api/tasks',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({projectId:p,title})});await load();showTask(t.id)}
async function showTask(id){state.taskId=id;state.taskTab='plan';const x=await api('/api/tasks/'+id+'/show');renderTaskModal(x);connectTaskStream(id)}
function renderTaskModal(x){const t=x.task;const tab=state.taskTab;let content='';if(tab==='plan')content=`<h3>Plan</h3><pre>${esc(t.plan||'No plan yet.')}</pre>`;if(tab==='execute')content=`<h3>Execution</h3><div class="kv"><b>State</b>${status(t.state)}<b>Worktree</b><code>${esc(t.worktree||'Not created')}</code><b>Branch</b><code>${esc(t.branch||'Not created')}</code><b>Base commit</b><code>${esc(t.base_commit||'Not created')}</code></div><h3>Runs</h3>${x.runs.map(runBlock).join('')}`;if(tab==='review')content=`<h3>Review</h3><pre>${esc(t.review||'No review yet.')}</pre>`;if(tab==='activity')content=`<h3>Live activity</h3><div id="events">${state.taskEvents.map(eventBlock).join('')||'<div class="muted">Waiting for events…</div>'}</div>`;$('#modal').innerHTML=`<div class="modal"><div><div class="top"><div><h1>${esc(t.title)}</h1><div class="row">${status(t.state)} <span class="muted">${t.id}</span></div></div>${btn('Close','closeTask()','secondary')}</div><div class="tabs">${['plan','execute','review','activity'].map(a=>`<button class="${tab===a?'active':''}" onclick="state.taskTab='${a}';renderTaskModal(${JSON.stringify(x).replace(/</g,'\\u003c')})">${a.toUpperCase()}</button>`).join('')}</div>${content}<div class="row" style="margin-top:18px">${t.state==='AWAITING_APPROVAL'?btn('Approve Plan',`action('${t.id}','approve')`):''}${t.state==='APPROVED'?btn('Execute',`action('${t.id}','execute')`):''}${t.state==='REVIEWING'?btn('Review',`action('${t.id}','review')`):''}${t.state==='REPAIRING'?btn('Repair',`action('${t.id}','repair')`):''}</div></div></div>`}
function runBlock(r){return `<div class="task"><div><b>${esc(r.role)}</b><div class="muted">${esc(r.provider_id)}/${esc(r.model_id)}</div></div><div>${status(r.status)}<div class="muted">${Number(r.tokens||0).toLocaleString()} tokens · $${Number(r.cost||0).toFixed(6)}</div></div></div>`}function eventBlock(e){const d=typeof e.data==='string'?e.data:JSON.stringify(e.data,null,2);return `<div class="event"><b>${esc(e.type)}</b> <span class="muted">${esc(e.created_at)}</span><pre>${esc(d)}</pre></div>`}
function connectTaskStream(id){if(state.stream)state.stream.close();state.taskEvents=[];state.stream=new EventSource('/api/tasks/'+id+'/stream');state.stream.addEventListener('event',e=>{state.taskEvents.push(JSON.parse(e.data));if(state.taskTab==='activity'){const x={task:state.data.tasks.find(t=>t.id===id)||{},runs:[]};renderTaskModal({...x,task:{...x.task}})}});state.stream.addEventListener('state',async e=>{const task=JSON.parse(e.data).task;const x=await api('/api/tasks/'+id+'/show');renderTaskModal(x);});state.stream.addEventListener('error',()=>{})}
function closeTask(){if(state.stream)state.stream.close();state.stream=null;$('#modal').innerHTML=''}
async function action(id,op){try{await api('/api/tasks/'+id+'/'+op,{method:'POST'});await load();const x=await api('/api/tasks/'+id+'/show');renderTaskModal(x)}catch(e){alert(e.message)}}
async function configureProvider(id){const p=state.data.providers.find(x=>x.id===id),models=state.data.models.filter(x=>x.provider_id===id);$('#modal').innerHTML=`<div class="modal"><div><div class="top"><h1>Configure ${esc(p.name)}</h1>${btn('Close','closeTask()','secondary')}</div><div class="stack"><div class="field"><label>Enabled</label><select id="p-enabled"><option value="true" ${p.enabled?'selected':''}>Enabled</option><option value="false" ${!p.enabled?'selected':''}>Disabled</option></select></div><div class="field"><label>Routable</label><select id="p-routable"><option value="true" ${p.config?.routable!==false&&p.kind!=='mock'?'selected':''}>Eligible for automatic routing</option><option value="false" ${p.config?.routable===false||p.kind==='mock'?'selected':''}>Not eligible</option></select></div>${p.kind==='deepseek'?`<div class="field"><label>API key environment variable</label><input id="p-keyenv" value="${esc(p.config?.apiKeyEnv||'DEEPSEEK_API_KEY')}"></div><div class="field"><label>Default effort</label><select id="p-effort">${['low','medium','high','xhigh','max'].map(x=>`<option ${p.config?.effort===x?'selected':''}>${x}</option>`).join('')}</select></div>`:''}<div class="row">${btn('Save',`saveProvider('${id}')`)}</div><h2>Models</h2>${models.map(m=>`<div class="card"><div class="top"><b>${esc(m.name)}</b>${status(m.enabled?'Enabled':'Disabled')}</div><div class="grid3"><div class="field"><label>Quality</label><input id="q-${m.id}" type="number" step="0.1" value="${m.quality}"></div><div class="field"><label>Speed</label><input id="s-${m.id}" type="number" step="0.1" value="${m.speed}"></div><div class="field"><label>Enabled</label><select id="e-${m.id}"><option value="true" ${m.enabled?'selected':''}>Yes</option><option value="false" ${!m.enabled?'selected':''}>No</option></select></div></div><button class="secondary" onclick="saveModel('${m.id}')">Save model</button></div>`).join('')}</div></div></div>`}
async function saveProvider(id){const p=state.data.providers.find(x=>x.id===id);const config={...p.config,routable:$('#p-routable').value==='true'};if($('#p-keyenv'))config.apiKeyEnv=$('#p-keyenv').value;if($('#p-effort'))config.effort=$('#p-effort').value;await api('/api/providers/'+id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({enabled:$('#p-enabled').value==='true',config})});closeTask();await load()}
async function saveModel(id){await api('/api/models/'+id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({quality:Number($('#q-'+id).value),speed:Number($('#s-'+id).value),enabled:$('#e-'+id).value==='true'})});closeTask();await load()}
async function toggleProvider(id,en){await api('/api/providers/'+id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({enabled:en})});await load()}
async function testProvider(id){const p=state.data.providers.find(x=>x.id===id);const models=state.data.models.filter(m=>m.provider_id===id&&m.enabled);const pick=prompt('Model ID to test (leave blank for first enabled):',models[0]?.id||'');const r=await api('/api/providers/'+id+'/test',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({modelId:pick||undefined})});alert(JSON.stringify(r,null,2));await load()}
async function addProvider(){const kind=prompt('Provider kind: claude-code or deepseek');if(!kind)return;const id=kind==='deepseek'?'deepseek-claude-code':'anthropic-claude-code';const name=kind==='deepseek'?'DeepSeek via Claude Code':'Anthropic / Claude Code';await api('/api/providers',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,name,kind,enabled:true,config:{routable:true,apiKeyEnv:kind==='deepseek'?'DEEPSEEK_API_KEY':undefined,effort:'high'}})});await load()}
async function saveRouting(){const roles=['planner','implementer','reviewer','repair'];const next={...state.data.routing};for(const role of roles){const pref=$('#preferred-'+role).value;const fallback=[$('#fallback1-'+role).value,$('#fallback2-'+role).value].filter(Boolean).filter(x=>x!==pref);next[role]={...next[role],strategy:$('#strategy-'+role).value,preferred:pref?[pref]:[],fallback,effort:$('#effort-'+role).value}}await api('/api/routing',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(next)});await load();alert('Routing saved')}
async function doctor(){const x=await api('/api/doctor');$('#doctor').textContent=JSON.stringify(x,null,2)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});load();setInterval(()=>{if(!state.taskId)load()},5000);
</script></body></html>
